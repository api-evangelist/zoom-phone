aid: zoom-phone
url: https://raw.githubusercontent.com/api-evangelist/zoom-phone/refs/heads/main/apis.yml
name: Zoom Phone
kind: company
description: 'Zoom Phone is the cloud PBX / UCaaS voice product of Zoom Communications, headquartered
  in San Jose, California, and sold worldwide from its United States home market. It replaces on-premise
  telephony with a cloud calling service — extensions, auto receptionists, IVR, call queues, shared
  line groups, voicemail, call recording, fax, emergency (E911) addressing, and SMS/MMS — delivered
  either on Zoom-provided PSTN service, on a customer''s own carrier through BYOC and Cloud Peering
  (Provider Exchange), or resold through carrier partners. In the telecom value chain Zoom Phone
  sits above the network as a UCaaS application layer that buys wholesale connectivity and number
  inventory from carriers rather than operating a mobile network, and its API posture reflects the
  software half of that split rather than the carrier half: the Zoom Phone API is fully self-serve,
  published as downloadable OpenAPI 3.0 with 391 documented operations across 46 resource groups,
  a 71-event webhook catalog, a separate Number Management API covering number allocation, BYOC numbers,
  ported number orders, SIP trunks and 10DLC SMS campaigns, OAuth 2.0 with fine-grained phone:* scopes,
  a public Postman workspace, and an official Node/TypeScript SDK. It is not a mobile network operator,
  is not a GSMA Open Gateway signatory, and exposes no CAMARA network APIs — no CAMARA reference
  was found anywhere in its developer surface.'
