apis:
- aid: zoom-phone:zoom-phone-api
  name: Zoom Phone API
  description: The Zoom Phone API is the administrative and operational REST API for Zoom's cloud
    phone system. The harvested OpenAPI 3.0 document describes 238 paths and 391 operations across
    46 resource groups — Users, Sites, Call Queues, Auto Receptionists, Shared Line Groups, Common
    Areas, Phone Devices, Call Logs, Recordings, Voicemails, Fax, SMS, SMS Campaigns, Phone Numbers,
    Emergency Addresses and Emergency Service Locations, Outbound Calling, Routing Rules, Dashboard,
    Reports, Provider Exchange and Carrier Reseller. Requires a Business or Enterprise account with
    a Zoom Phone license.
  humanURL: https://developers.zoom.us/docs/api/phone/
  baseURL: https://api.zoom.us/v2
  tags:
  - Voice
  - Cloud PBX
  - Call Logs
  - SMS
  - Provisioning
  properties:
  - type: Documentation
    url: https://developers.zoom.us/docs/api/phone/
  - type: APIReference
    url: https://developers.zoom.us/docs/api/phone/
  - type: OpenAPI
    url: openapi/zoom-phone-api-openapi.json
  - type: Documentation
    url: https://developers.zoom.us/docs/integrations/oauth/
  - type: PostmanCollection
    url: https://www.postman.com/zoom-developer/zoom-public-workspace/documentation/uba96fr/phone
- aid: zoom-phone:zoom-phone-webhooks
  name: Zoom Phone Webhooks
  description: The Zoom Phone event catalog, published as an OpenAPI 3.1 document using the top-level
    webhooks object. It defines 71 real-time events covering call lifecycle (phone.caller_ringing,
    phone.callee_answered, phone.caller_ended, phone.callee_missed, phone.caller_hold, warm and blind
    transfers), recordings and transcripts, voicemail, fax, call and fax logs, SMS send and delivery,
    SMS campaign opt-in/opt-out and etiquette blocking, device registration, emergency alerts, AI
    call summaries, and account and group setting changes. Delivered to an HTTPS endpoint, with a
    WebSocket delivery option in public beta.
  humanURL: https://developers.zoom.us/docs/api/phone/events/
  tags:
  - Webhook
  - Event
  - Call Events
  - Real-Time
  tags_raw:
  - Webhooks
  - Events
  - Call Events
  - Real Time
  properties:
  - type: Documentation
    url: https://developers.zoom.us/docs/api/phone/events/
  - type: APIReference
    url: https://developers.zoom.us/docs/api/phone/events/
  - type: OpenAPI
    url: openapi/zoom-phone-webhooks-openapi.json
- aid: zoom-phone:zoom-phone-number-management-api
  name: Zoom Phone Number Management API
  description: The Number Management API provisions and manages phone number inventory for Zoom Phone,
    Zoom Contact Center, and Zoom Meetings accounts. The harvested OpenAPI 3.0 document describes
    17 paths and 28 operations covering number allocation, BYOC numbers, carrier and cloud peering
    numbers, ported number orders, SIP trunks and SIP groups, phone plans, and 10DLC SMS campaigns
    and SMS consent — the most carrier-facing surface Zoom publishes.
  humanURL: https://developers.zoom.us/docs/api/number-management/
  baseURL: https://api.zoom.us/v2
  tags:
  - Phone Numbers
  - Number Porting
  - BYOC
  - SIP Trunks
  - Carrier Peering
  - SMS Campaigns
  properties:
  - type: Documentation
    url: https://developers.zoom.us/docs/api/number-management/
  - type: APIReference
    url: https://developers.zoom.us/docs/api/number-management/
  - type: OpenAPI
    url: openapi/zoom-phone-number-management-openapi.json
