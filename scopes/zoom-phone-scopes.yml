method: searched
source: >-
  openapi/zoom-phone-api-openapi.json, openapi/zoom-phone-number-management-openapi.json
  (oauth2 flows + per-operation x-macro-scopes / x-granular-scopes), confirmed against
  https://developers.zoom.us/docs/integrations/oauth-scopes-granular/
docs: https://developers.zoom.us/docs/integrations/oauth-scopes-granular/
docs_classic: https://developers.zoom.us/docs/integrations/oauth-scopes/
docs_overview: https://developers.zoom.us/docs/integrations/oauth-scopes-overview/
docs_migration: https://developers.zoom.us/docs/integrations/migrate/
summary: >-
  Zoom runs two parallel scope models. CLASSIC scopes are coarse (phone:read, phone:write,
  phone:read:admin, phone:write:admin, phone:master); GRANULAR scopes are per-operation and
  follow product:action:resource[:admin|:master] — phone:read:list_users:admin,
  phone:write:calling_plan:admin, number_management:delete:numbers:admin. Every Zoom Phone
  operation publishes BOTH forms in its spec extension block (x-macro-scopes and
  x-granular-scopes), which is why 435 distinct scopes are derivable from the two specs. Zoom
  is actively migrating apps off classic scopes onto granular ones; new apps should request
  granular scopes only, and the :admin / :master suffixes gate account-level and
  master-account access respectively.
authorization_endpoint: https://zoom.us/oauth/authorize
token_endpoint: https://zoom.us/oauth/token
