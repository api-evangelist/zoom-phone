summary: >-
  Zoom's only first-party server-side client library that covers the Zoom Phone API is Zoom
  Rivet for JavaScript (@zoom/rivet), a Node.js/TypeScript framework whose module matrix
  explicitly lists Phone alongside Accounts, Marketplace, Meetings, Team Chat and Users. Zoom
  publishes no first-party Python, Java, .NET, Go, Ruby, PHP or Rust client for the REST API;
  the widely used `zoomus` PyPI package is community-maintained (prschmid), not Zoom. The
  other @zoom/* npm packages are client-side media SDKs (Meeting SDK, Video SDK, Apps SDK,
  RTMS) that do not wrap the Phone REST API and are listed here for completeness only.
packages:
- language: javascript
  registry: npm
  name: "@zoom/rivet"
  version: 0.4.0
  url: https://www.npmjs.com/package/@zoom/rivet
  source: https://github.com/zoom/rivet-javascript
  docs: https://developers.zoom.us/docs/rivet/javascript/
  install: npm install @zoom/rivet
  official: true
  covers_zoom_phone: true
  note: >-
    Server-side framework: OAuth/S2S OAuth token handling, typed Web API wrappers and webhook
    event listeners. The README auth matrix lists Phone as a supported module under both User
    OAuth and Server-to-Server OAuth. Authored by Zoom Communications, Inc.
