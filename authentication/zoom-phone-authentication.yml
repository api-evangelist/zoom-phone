summary_narrative: >-
  Zoom Phone accepts exactly one credential: an OAuth 2.0 bearer access token in the
  Authorization header. The apiKey scheme the specs declare (openapi_authorization, header
  "Authorization") is the spec's representation of that bearer header, not a separate API-key
  model — there are no Zoom Phone API keys. Four app shapes issue tokens: user-managed OAuth
  (authorization_code), Server-to-Server OAuth (Zoom's own account_credentials grant, the right
  choice for provisioning and reporting), device authorization (device_code), and client
  credentials. Access tokens are short-lived and refreshed with refresh_token; the token
  response carries an api_url naming the region that should serve the account. JWT app
  credentials survive only for the Video/Meeting SDKs, not the Phone REST API.
