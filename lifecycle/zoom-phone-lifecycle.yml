generated: '2026-07-25'
method: searched
source: >-
  https://developers.zoom.us/docs/build/lifecycle/,
  https://developers.zoom.us/docs/phone/migrate/,
  https://developers.zoom.us/docs/phone/webhook-migrate/,
  https://developers.zoom.us/changelog/ (product=Phone, Number Management), and derived
  deprecated:true operations from the two Zoom Phone OpenAPI documents
summary: >-
  Zoom publishes a named developer lifecycle (initial release -> deprecation -> sunset -> end of
  life) that applies to APIs, SDKs and webhooks, and it is actively exercised on Zoom Phone: the
  legacy Call Logs API (v1) is fully deprecated in April 2026, the legacy Call Log webhooks in
  May 2026, and the transitional call_log/call_path response arrays in November 2026. 31 of the
  419 operations are already flagged deprecated in the specification itself.
versioning:
  scheme: uri-path
  current: v2
  base_url: https://api.zoom.us/v2
  resource_versioning: >-
    Zoom Phone versions resource families in place rather than bumping the path — Call Logs
    (v1) -> Call History (v2, Dec 2023) -> Call History Enhancement / Call Elements (v3, 2025).
  docs: https://developers.zoom.us/docs/api/using-zoom-apis/
deprecation:
  policy_url: https://developers.zoom.us/docs/build/lifecycle/
  stages: [initial release, deprecation, sunset, end of life]
  notice_contents: [deprecation date, recommended alternative, expected sunset timeline]
  sunset_header: false
  deprecation_header: false
  note: >-
    Zoom announces deprecations through the dated changelog and migration guides. There is no
    RFC 8594 Sunset or Deprecation response header on the Zoom Phone API; the only in-band
    signal is the OpenAPI `deprecated: true` flag.
  announcement_channel: https://developers.zoom.us/changelog/?product=phone
sunsets:
- item: Legacy Call Logs API (v1)
  operations: [accountCallLogs, getCallLogDetails, phoneUserCallLogs, syncUserCallLogs, deleteCallLog, addClientCodeToCallLog]
  date: '2026-04'
  replacement: Call History API (GET /phone/call_history, GET /phone/call_history/{call_history_uuid})
  guide: https://developers.zoom.us/docs/phone/migrate/
- item: Legacy Call Logs webhooks (v1)
  events: [phone.call_log_deleted, phone.callee_call_log_completed, phone.caller_call_log_completed, phone.call_log_permanently_deleted]
  date: '2026-05'
  replacement: Call Element events (phone.call_element_deleted, phone.callee_call_element_completed, phone.caller_call_element_completed)
  guide: https://developers.zoom.us/docs/phone/webhook-migrate/
- item: call_log response array on Get account's call history
  date: '2026-11'
  replacement: call_history array with call_history_uuid + call_id
- item: call_path response array on Get call history
  date: '2026-11'
  replacement: call_elements array with call_element_id + call_id
- item: Get call history detail endpoint
  date: '2026-11'
  replacement: 'GET /phone/call_element/{call_element_id}'
sla:
  url: null
  uptime_target: null
  note: >-
    No public uptime SLA for the Zoom Phone API. Zoom Phone service-level commitments are
    contractual (enterprise agreements), not published on the developer surface.
