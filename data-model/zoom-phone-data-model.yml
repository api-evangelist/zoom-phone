summary: >-
  Neither Zoom Phone OpenAPI declares components.schemas — every request and response body is
  inlined — so the entity graph below is derived from path structure, id parameters and the 47
  resource tags rather than from $ref links. The model has one organising abstraction: the
  EXTENSION. Users, common areas, call queues, auto receptionists, shared line groups, Zoom
  Rooms and group call pickups are all extension-bearing objects that can own numbers, call
  handling settings, policies and outbound calling rules. Phone numbers are inventory that is
  assigned to extensions; call records are immutable events that reference both.
