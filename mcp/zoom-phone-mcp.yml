summary: 'Zoom operates a fleet of first-party hosted MCP servers at mcp.zoom.us, advertised through an
  MCP server card at /.well-known/mcp/server-card.json on the developer host and published to the official
  MCP registry (registry.modelcontextprotocol.io) from github.com/zoom/mcp-registry as io.github.zoom/*.
  All servers use streamable HTTP transport with server-to-server OAuth. There is NO Zoom Phone-specific
  MCP server: the Phone REST surface (391 operations) is not exposed as MCP tools today. mcp.zoom.us/mcp/phone/streamable
  returns -32602 "instance not found". Anonymous tools/list against the general Workspace server returns
  HTTP 401 with -32001 "Access token is required", so live tool schemas require an authenticated introspection
  — no tool names are published anywhere for this provider, and none are invented here.'
server:
  name: Zoom MCP Server (Workspace)
  transport: http
  url: https://mcp.zoom.us/mcp/zoom/streamable
  registry_id: io.github.zoom/zoom-workspace
  version: 1.0.2
  capabilities:
    tools: true
    resources: true
    prompts: false
  authentication:
    type: s2s
    token_type: oauth
    authorization_server: https://zoom.us
    metadata: https://zoom.us/.well-known/oauth-authorization-server
  docs: https://developers.zoom.us/docs/mcp/servers/connect-to-zoom-mcp-servers/
  covers_zoom_phone: false
  probe:
    method: tools/list
    status: 401
    response: '{"jsonrpc":"2.0","error":{"code":-32001,"message":"Access token is required"}}'
    note: Tool list and inputSchemas are auth-gated; not published in llms.txt or docs.
