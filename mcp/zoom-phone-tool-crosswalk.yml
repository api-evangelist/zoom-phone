summary: >-
  Zoom ships both a large REST surface for Zoom Phone (419 operations across two OpenAPI
  documents) and a fleet of hosted MCP servers — but the two do not overlap. No Zoom MCP
  server exposes Zoom Phone provisioning, call history, SMS or number management, and the
  live tools/list on the general Workspace server is auth-gated (HTTP 401, -32001
  "Access token is required"), so no tool names or inputSchemas are published for ANY Zoom
  server. This crosswalk therefore records a complete divergence rather than a mapping: every
  Zoom Phone capability is REST-only. No tool-to-operation bindings are invented.
