  /phone/users/{userId}/call_history/sync:
    get:
      tags:
      - Call Logs
      summary: Sync user's call history
      description: "Syncs a user's [Zoom phone](https://support.zoom.us/hc/en-us/articles/360001297663-Quickstart-Guide-for-Zoom-Phone-Administrators) call history. \n\nFor user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\n**Prerequisites** \n* A Business or Enterprise account\n * A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:admin`,`phone:read`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:list_call_logs`,`phone:read:list_call_logs:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`"
      operationId: syncUserCallHistory
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
      - name: sync_type
        in: query
        description: 'The options for synchronizing call log:   FSync - Full sync   ISync - Increase sync   BSync - Backward sync'
        required: false
        schema:
          type: string
          example: FSync
      - name: count
