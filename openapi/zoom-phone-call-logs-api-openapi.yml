      summary: Get User AI Call Summary Detail
      description: "Returns AI call summary details. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\n**Prerequisites:** \n* A Business or Enterprise account \n* A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:admin`,`phone:read`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:ai_call_summary`,`phone:read:ai_call_summary:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`"
      operationId: getUserAICallSummary
      parameters:
      - name: userId
        in: path
        description: The owner's user ID.
        required: true
        schema:
          type: string
          example: 8XQfveqPRB2TfEIa4SygEA
      - name: aiCallSummaryId
        in: path
        description: The ID of the AI call summary.
        required: true
        schema:
          type: string
          example: DcmBZMsTSuOVTorcxJzeFg
      responses:
        '200':
          description: '**HTTP Status code:** `200`User AI call summary returned.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ai_call_summary_id:
                    type: string
                    description: The ID of the AI call summary.
                    example: HfBQmSIARZi5zeDMmofwTA
                  account_id:
                    type: string
                    description: The ID of the account.
                    example: A88lsb7WQ46FwTeNe8jsMw
                  call_id:
                    type: string
                    description: The ID of the phone call.
                    example: '7018317023722949162'
                  user_id:
                    type: string
                    description: The owner's user ID.
                    example: x2ci3VDeQEqJsuHkn5oRzg
                  call_summary_rate:
                    type: string
                    description: The call summary rate.
                    example: thumb_up
                    enum:
                    - thumb_up
                    - thumb_down
                  transcript_language:
                    type: string
                    description: The transcription language ID.
                    example: en
                  call_summary:
                    type: string
                    description: The recap of the call summary.
                    example: Tom discussed his personal beliefs and values, including his support for certain political figures and his advocacy for various social causes.
                  next_steps:
                    type: string
                    description: The next step in the call summary.
                    example: Tom will provide PPT next Tuesday.
