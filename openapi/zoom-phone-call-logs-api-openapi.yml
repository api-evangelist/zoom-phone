  /phone/users/{userId}/call_history/{callLogId}:
    delete:
      tags:
      - Call Logs
      summary: Delete a user's call history
      description: "Deletes a user's [call history](https://support.zoom.us/hc/en-us/articles/360021114452-Viewing-and-identifying-logs). \n\nFor user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\n**Prerequisites** \n\n* Belong to a Business or Enterprise account \n* Have a Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write`,`phone:write:admin`,`phone_call_log:write`,`phone_call_log:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:delete:call_log`,`phone:delete:call_log:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: deleteUserCallHistory
      parameters:
      - name: userId
        in: path
        description: The user ID or email address of the user.
        required: true
        schema:
          type: string
          example: DnEopNmXQEGU2uvvzjgojw
      - name: callLogId
        in: path
        description: The unique identifier of the call log. The value for this field can be retrieved from [account's call logs](https://marketplace.zoom.us/docs/api-reference/phone/methods#operation/accountCallLogs) or [user's call logs](https://marketplace.zoom.us/docs/api-reference/phone/methods#operation/phoneUserCallLogs).
        required: true
        schema:
          type: string
          example: 20231008-c106fda5-7320-46cb-a5d2-7c73a2173d2f
      responses:
        '204':
          description: Call history has been deleted successfully
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `300` <br>\n User does not exist: {userId}. <br>\n**Error Code:** `301` <br>\n Call history not found: {callLogId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write
        - phone:write:admin
        - phone_call_log:write
        - phone_call_log:write:admin
        - phone:delete:call_log
        - phone:delete:call_log:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write
        - phone:write:admin
        - phone_call_log:write
        - phone_call_log:write:admin
        x-granular-scopes:
        - phone:delete:call_log
        - phone:delete:call_log:admin
  /phone/users/{userId}/call_logs:
    get:
      tags:
      - Call Logs
      summary: Get user's call logs
      description: "Returns a user's [Zoom phone](https://support.zoom.us/hc/en-us/articles/360001297663-Quickstart-Guide-for-Zoom-Phone-Administrators) call logs. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\n**Prerequisites:** \n* A Business or Enterprise account \n* A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read`,`phone:read:admin`,`phone_call_log:read`,`phone_call_log:read:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:list_call_logs`,`phone:read:list_call_logs:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`"
      operationId: phoneUserCallLogs
      parameters:
      - name: userId
        in: path
        description: The user ID or email address of the user. For user-level apps, pass `me` as the value for userId.
        required: true
        schema:
          type: string
          example: DYHrdpjrS3uaOf7dPkkg8w
      - name: page_size
        in: query
        description: The number of records returned within a single API call.
        required: false
        schema:
          maximum: 300
          type: integer
          example: 30
          default: 30
      - name: from
        in: query
        description: The start time and date in **yyyy-mm-dd** or **yyyy-MM-dd'T'HH:mm:ss'Z'** format. The date range defined by the `from` and `to` parameters should be a month as the response only includes one month's worth of data. The month defined should fall within the last six months. If unspecified, returns data within the 24 hours.
        required: false
        schema:
          type: string
          format: date
          example: '2020-10-31'
      - name: to
        in: query
        description: '**Required** only when the `from` parameter is specified. End time and date in **yyyy-mm-dd** or **yyyy-MM-dd''T''HH:mm:ss''Z''** format, the same format as the `from` parameter.'
        required: false
        schema:
          type: string
          format: date
          example: '2021-12-31'
      - name: type
        in: query
        required: false
        schema:
          type: string
          example: all
          enum:
          - all
          - missed
      - name: next_page_token
        in: query
        description: The next page token paginates through a large set of results. A next page token returns whenever the set of available results exceeds the current page size. The expiration period for this token is 15 minutes.
        required: false
        schema:
          type: string
          example: BJLYC6PABbAHdjwSkGVQeeR6B1juwHqj3G2
      - name: phone_number
        in: query
        description: This field filters API responses to include call logs of only the phone number defined in this field.
        required: false
        schema:
          type: string
          example: '+12055432724'
      - name: time_type
        in: query
        description: This field enables you to sort call logs by start or end time. Choose the sort time value. Values include `startTime` or `endTime`.
        required: false
        schema:
          type: string
          example: startTime
          default: startTime
          enum:
          - startTime
          - endTime
      responses:
        '200':
          description: '**HTTP Status code:** `200`

            User''s call logs returned.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_logs:
                    maxItems: 100
                    type: array
                    description: The call Log
                    items:
                      type: object
                      properties:
                        accepted_by:
                          type: object
                          properties:
                            extension_number:
                              type: string
                              example: '1009'
                            location:
                              type: string
                              example: Pontotoc     MS
                            name:
                              type: string
                              example: Display name
                            number_type:
                              type: integer
                              description: 'The phone number types: `1` - Extension `2`- E164 number `3` - Custom number.'
                              example: 1
                            phone_number:
                              type: string
                              example: '+12055432724'
                          description: This field indicates who accepted the call.
                        answer_start_time:
                          type: string
                          description: The call's answer time, in GMT `date-time` format. The API only displays this response if the `direction` value is `inbound`.
                          example: '2021-10-09T16:52:05Z'
