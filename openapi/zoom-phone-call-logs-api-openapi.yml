  /phone/call_logs/{callLogId}/client_code:
    put:
      tags:
      - Call Logs
      summary: Add a client code to a call log
      description: "Adds a client code to a [call log](https://support.zoom.us/hc/en-us/articles/360040999352-Assigning-client-codes-to-phone-calls). You can track call logs with a client code. \n\n**Prerequisites:**\n* Business or Education account\n* Zoom Phone license \n\n\n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:call_log:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: addClientCodeToCallLog
      parameters:
      - name: callLogId
        in: path
        description: The unique identifier of the call log.
        required: true
        schema:
          type: string
          example: a55d94f7-27ea-4dbb-ab25-028f2c8d55bd
