  /phone/users/{userId}/sms/sessions/sync:
    get:
      tags:
      - SMS
      summary: List user's SMS sessions in descending order
      description: "Retrieves the user's SMS sessions in descending order. Mirrors the ZP client behavior with the most recent on top.\n\n**Prerequisites:**\n* Paid account \n* User-enabled Zoom phone   \n   \n \n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:admin`,`phone:read`,`phone_sms:read`,`phone_sms:read:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:sms_session`,`phone:read:sms_session:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`"
      operationId: GetSmsSessions
      parameters:
      - name: userId
        in: path
        description: The user ID, user email, or &ldquo;me&rdquo; when using OAuth token.
        required: true
        schema:
          type: string
          example: DnEopNmXQEGU2uvvzjgojw
      - name: sync_type
        in: query
        description: 'FSync: Full sync BSync: Backward sync ISync: Forward sync'
        required: true
        schema:
          type: string
          example: FSync
          default: FSync
          enum:
          - FSync
          - BSync
          - ISync
      - name: sync_token
        in: query
        description: The sync token. Use if requesting a backward (`BSync`) or forward (`ISync`) sync.
        required: false
        schema:
          type: string
          example: MFgyQ0Z3UDkwaF8xNjQyNDA3MjA3MDE0XzE2NDI0MDcyMDcwMTQ=
      - name: count
        in: query
        description: The record count of each query
        required: false
        schema:
          maximum: 250
          minimum: 1
          type: integer
          example: 50
      - name: session_type
        in: query
        description: "This field filters the specific session list by a session type.\nThe value for this field can be one of the following:  \n `user`  \n `call_queue`  \n `auto_receptionist`  \n `all`"
        required: false
        schema:
          type: string
          example: user
          default: user
      responses:
        '200':
          description: "**HTTP Status Code:** `200` **No Content**  \n \nSuccessfully listed the SMS sessions."
          content:
            application/json:
              schema:
                type: object
                properties:
                  sms_sessions:
                    maxItems: 250
                    type: array
                    items:
                      type: object
                      properties:
                        last_access_time:
                          type: string
                          description: The last send or receive time in UTC.
                          example: '2022-03-25T02:11:27Z'
                        latest_message:
                          type: object
                          properties:
                            attachments:
                              maxItems: 10
                              type: array
                              items:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: The media file ID.
                                    example: ttllslww
                                  type:
                                    type: string
                                    description: 'The file type: OTHER, PNG, GIF, JPG/JPEG, AUDIO, VIDEO'
                                    example: GIF
                                    enum:
                                    - OTHER
                                    - PNG
                                    - GIF
                                    - JPG/JPEG
                                    - AUDIO
                                    - VIDEO
                            date_time:
                              type: string
                              description: The UTC time the message was created.
                              example: '2022-03-25T02:11:27Z'
                            direction:
                              type: string
                              description: '`In`(SMS received) or `Out`(SMS sent)'
                              example: Out
                            message:
                              type: string
                              description: The content of the SMS.
                              example: hello
                            message_id:
                              type: string
                              description: The message ID.
                              example: cfc07047-123e-4097-91d4-ac2635d646af
                            message_type:
                              type: integer
                              description: "The message type:  \n \n1 - SMS  \n \n2 - MMS  \n \n3 - GROUP_SMS  \n \n4 - GROUP_MMS  \n \n5 - SMS_INTER  \n \n6 - MSG_ON_NET"
                              example: 6
                              enum:
                              - 1
                              - 2
                              - 3
                              - 4
                              - 5
                              - 6
                            sender:
                              required:
                              - phone_number
                              type: object
                              properties:
                                display_name:
                                  type: string
                                  description: The sender's name.
                                  example: usersubsetting0001@testapi.com
                                owner:
                                  type: object
                                  properties:
                                    id:
                                      type: string
                                      description: The owner ID.
                                      example: DnEopNmXQEGU2uvvzjgojw
                                    type:
                                      type: string
                                      description: 'The owner type:

                                        *`user`

                                        *`callQueue`

                                        *`autoReceptionist`

                                        *`sharedLineGroup`'
                                      example: user
                                      enum:
                                      - user
                                      - callQueue
                                      - autoReceptionist
                                      - sharedLineGroup
                                phone_number:
                                  type: string
                                  description: The sender's phone number.
                                  example: '+18108001001'
                            to_members:
                              maxItems: 10
                              type: array
                              items:
                                required:
                                - phone_number
                                type: object
                                properties:
                                  display_name:
                                    type: string
                                    description: The participant name.
                                    example: test api
                                  owner:
                                    type: object
                                    properties:
                                      id:
                                        type: string
                                        description: The owner ID.
                                        example: QOFvOvk7SJeOR2VBfL79_g
                                      type:
                                        type: string
                                        description: 'The owner type:

                                          *`user`

                                          *`callQueue`

                                          *`autoReceptionist`

                                          *`sharedLineGroup`'
                                        example: user
                                        enum:
                                        - user
                                        - callQueue
                                        - autoReceptionist
                                        - sharedLineGroup
                                  phone_number:
                                    type: string
                                    description: The receiver's phone number.
                                    example: '+13522348840'
                        participants:
                          maxItems: 10
                          type: array
                          description: The SMS senders and receivers.
                          items:
                            type: object
                            properties:
                              display_name:
                                type: string
                                description: The SMS sender or receiver name.
                                example: usersubsetting0001@testapi.com
                              owner:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    description: The owner ID.
                                    example: QOFvOvk7SJeOR2VBfL79_g
                                  type:
                                    type: string
                                    description: 'The owner type:

                                      *`user`

                                      *`callQueue`

                                      *`autoReceptionist`

                                      *`sharedLineGroup`'
                                    example: user
                                    enum:
                                    - user
                                    - callQueue
                                    - autoReceptionist
                                    - sharedLineGroup
                              phone_number:
                                type: string
                                description: The SMS sender or receiver phone number.
                                example: '+13522348840'
                              is_session_owner:
                                type: boolean
                                description: Whether it is the owner of the session.
                                example: true
                        session_id:
                          type: string
                          description: The SMS session ID.
                          example: 67e261d9eefb2f87dc8193b4c2aeb1d8
                        session_type:
                          type: string
                          description: "The session type.\nThe value for this field can be one of the following:  \n `user`  \n `call_queue`  \n `auto_receptionist`"
                          example: user
                        unread_message_count:
                          type: integer
                          description: The number of unread messages.
                          example: 125
                  sync_token:
                    type: string
                    description: The sync token for a backward (`BSync`) or forward (`ISync`) sync.
                    example: TVR5cXB2b2dmSl8xNjIxNTc0ODQ0MDY3XzE2NDgxNzQyODcwMDk=
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `400` <br>\n SMS session type is invalid. <br>\n**Error Code:** `300` <br>\n Invalid user id.<br>\nUser does not exist. <br>\n**Error Code:** `7035` <br>\n The number of new records exceeds the sync count. Please resync with the `FSync` method. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `2001` <br>\n Account does not exist. <br>\n**Error Code:** `300` <br>\n The sync token is invalid or expired. <br>\n**Error Code:** `1001` <br>\n User does not exist: {userId} <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:read:admin
        - phone:read
        - phone_sms:read
        - phone_sms:read:admin
        - phone:read:sms_session
        - phone:read:sms_session:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:read:admin
        - phone:read
        - phone_sms:read
        - phone_sms:read:admin
        x-granular-scopes:
        - phone:read:sms_session
        - phone:read:sms_session:admin
