                                properties:
                                  id:
                                    type: string
                                    description: The owner ID.
                                    example: DnEopNmXQEGU2uvvzjgojw
                                  type:
                                    type: string
                                    description: 'The owner type:

                                      *`user`

                                      *`callQueue`

                                      *`autoReceptionist`

                                      *`sharedLineGroup`'
                                    example: user
                                    enum:
                                    - user
                                    - callQueue
                                    - autoReceptionist
                                    - sharedLineGroup
                              phone_number:
