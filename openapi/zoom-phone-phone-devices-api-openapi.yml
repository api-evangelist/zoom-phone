        - phone:update:device_provision_template:admin
        openapi_authorization: []
      x-extensions:
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:update:device_provision_template:admin
  /phone/devices/{deviceId}/reboot:
    post:
      tags:
      - Phone Devices
      summary: Reboot a desk phone
      description: "Use this API to reboot an online zero-touch or assisted-provisioning device. You can only send one request every second.\n\n**Prerequisites:**\n* Pro or a higher account with Zoom Phone license\n* Account owner or admin permissions. \n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:reboot_device:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `Heavy`"
      operationId: rebootPhoneDevice
      parameters:
      - name: deviceId
        in: path
        description: Unique identifier of the device.
        required: true
        schema:
          type: string
          example: -tDdYIstSumpA0L13GztIQ
      responses:
        '202':
          description: "**HTTP Status Code:** `202` **Accepted**  \n \nDevice reboot command issued."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request\n\n**Error Code:** `400` <br>\nThe given device type does not support this action<br>\n*The given device is offline<br>\nOperation is too frequent. Please try again in a few minutes.<br><br>\n\n**Error Code:** `404` <br>\nDevice does not exist: {accountId}.<br>\n\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
