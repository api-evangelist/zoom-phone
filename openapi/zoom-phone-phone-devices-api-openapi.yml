      x-extensions:
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:delete:device:admin
    patch:
      tags:
      - Phone Devices
      summary: Update a device
      description: 'Updates the information of a [desk phone device](https://support.zoom.us/hc/en-us/articles/360021119092).


        **Prerequisites:**

        * Pro or a higher account with Zoom Phone license* Account owner or admin permissions


        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:device:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: updateADevice
      parameters:
      - name: deviceId
        in: path
        description: The unique identifier of the device.
        required: true
        schema:
          type: string
          example: -tDdYIstSumpA0L13GztIQ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                assigned_to:
                  type: string
                  description: The user ID or email address of the user assigned to this device. To retrieve the user ID and the email of the user, use the [List Users](https://marketplace.zoom.us/docs/api-reference/zoom-api/methods#operation/users) API.
                  example: DnEopNmXQEGU2uvvzjgojw
                display_name:
                  maxLength: 255
                  type: string
                  description: The display name of the desk phone.
                  example: testUser
                provision_template_id:
                  type: string
                  description: The provision template ID. It's supported only by some devices. An empty string represents 'No value set'
                  example: Ke5Ghevvoo001hr
      responses:
        '204':
          description: '**HTTP Status Code:** `204` **No Content**


            Device updated successfully.'
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Validation failed. Device does not exist in the system. Invalid userId. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User not found: {userId}\n\nThe user extension does not exist, extensionId: {extensionId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:update:device:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:update:device:admin
  /phone/devices/{deviceId}/extensions:
    post:
      tags:
      - Phone Devices
      summary: Assign an entity to a device
      description: 'By default, all Zoom Phone users can make and receive calls using the Zoom desktop and mobile applications. Additionally, if a desk phone is required, use this API to [add a desk phone and assign it to a user](https://support.zoom.us/hc/en-us/articles/360021119092#h_5ca07504-68a8-4c3d-ad0e-c1d3594436da).


        **Prerequisites:**

        * Pro or a higher account with Zoom Phone license

        * Account owner or admin permissions

        * [Supported device](https://support.zoom.us/hc/en-us/articles/360001299063-Zoom-Voice-Supported-Devices)




        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:device_extension:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `Light`'
      operationId: addExtensionsToADevice
      parameters:
      - name: deviceId
        in: path
        description: Unique identifier of the device.
        required: true
        schema:
          type: string
          example: Mekx3i2f0kVh
      requestBody:
        content:
          application/json:
            schema:
              required:
              - assignee_extension_ids
              type: object
              properties:
                assignee_extension_ids:
                  type: array
                  description: "Available only for the account that has enabled the common area feature. \n Extension ID of the [`user`](https://marketplace.zoom.us/docs/api-reference/phone/methods/#operation/phoneUser) or [`common area` ID](https://marketplace.zoom.us/docs/api-reference/phone/methods/#operation/listCommonAreas)."
                  items:
                    type: string
                    example: dsH7FaYRHy9gV4Qb8ecku
      responses:
        '201':
          description: "**HTTP Status Code:** `201` **Created**  \n \nAssignees assigned successfully. "
          content:
            application/json:
              schema: {}
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request\n\n**Error Code:** `300` <br>\n\n\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found\n\n**Error Code:** `1001` <br>\nUser extension ID or common area extension ID not found.\n\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write:device_extension:admin
        openapi_authorization: []
      x-extensions:
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:write:device_extension:admin
  /phone/devices/{deviceId}/extensions/{extensionId}:
    delete:
      tags:
      - Phone Devices
      summary: Unassign an entity from the device
      description: "Use this API to unassign a specific assignee from the device.\n\n**Prerequisites:**\n* Pro or a higher account with Zoom Phone license\n* Account owner or admin permissions. \n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:delete:device_extension:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `Light`"
      operationId: deleteExtensionFromADevice
      parameters:
      - name: deviceId
        in: path
        description: Unique identifier of the device from which to unassign an assignee.
        required: true
        schema:
          type: string
          example: Mekx3i2f0kVh
      - name: extensionId
        in: path
        description: Extension ID of the assignee (`user` or `common area`)
        required: true
        schema:
          type: string
          example: Pre4voa9HH
      responses:
        '204':
          description: "**HTTP Status Code:** `204` **No Content**  \n \n\nAssignee unassigned successfully."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request\n\n**Error Code:** `300` <br>\n\n\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:delete:device_extension:admin
        openapi_authorization: []
      x-extensions:
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:delete:device_extension:admin
  /phone/devices/{deviceId}/provision_templates:
    put:
      tags:
      - Phone Devices
      summary: Update provision template of a device
      description: "Use this API to [assign a provision template to a device](https://support.zoom.us/hc/en-us/articles/360035817952#h_6b52ef26-d070-40ed-a3fa-520571944afc) or [remove a provision template from the device](https://support.zoom.us/hc/en-us/articles/360035817952#h_7b34cd1d-5ae6-4a23-bd04-454a6ad8cb3e) by leaving `templateId` empty.\n\n**Prerequisites:**  \n \n* Pro or a higher account with Zoom Phone license\n* Account owner or admin permissions\n* [Supported device](https://support.zoom.us/hc/en-us/articles/360029698771#note)  \n \n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:device_provision_template:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `Light`"
      operationId: updateProvisionTemplateToDevice
      parameters:
      - name: deviceId
        in: path
        description: The device ID.
        required: true
        schema:
          type: string
          example: Mekx3i2f0kVh
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                provision_template_id:
                  type: string
                  description: The provision template ID. The provision template will be removed when this field is left empty.
                  example: AbSORcqsSnqqrMD3jmZ8yw
      responses:
        '204':
          description: "**HTTP Status Code:** `204` **No Content**  \n \nProvision template updated successfully. "
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request\n\n**Error Code:** `300` <br>\n\n\n**Error Code:** `404` <br>\nProvision template does not exist.\n\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
