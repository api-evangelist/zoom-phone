  /phone/smartphones:
    get:
      tags:
      - Phone Devices
      summary: List Smartphones
      description: "Returns a list of all the [smartphones](https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0074058) configured with Zoom Phone on an account.\n\n**Prerequisites**  \n \n* Pro or a higher account with Zoom Phone license\n* Account owner or admin permissions\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:list_devices:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`\n\n**Not supported in Gov cluster** "
      operationId: ListSmartphones
      parameters:
      - name: site_id
        in: query
        description: The site of the assignee.
        required: false
        schema:
          type: string
          example: lA68sMSVQ6GAUcGg_GH0nQ
      - name: keyword
        in: query
        description: The device name, common area, serial number, or IP address to filter the results.
        required: false
        schema:
          type: string
          example: smartphone
      - name: next_page_token
        in: query
        description: The next page token paginates through a large set of results. A next page token returns whenever the set of available results exceeds the current page size. The expiration period for this token is 15 minutes.
        required: false
        schema:
          type: string
          example: BJLYC6PABbAHdjwSkGVQeeR6B1juwHqj3G2
      - name: page_size
        in: query
        description: The number of records returned within a single API call.
        required: false
        schema:
          maximum: 300
          type: integer
          example: 30
          default: 30
      responses:
        '200':
          description: '**HTTP Status Code:** `200`   Smartphone listed successfully. '
          content:
            application/json:
              schema:
                required:
                - smartphones
                type: object
                properties:
                  smartphones:
                    maxItems: 300
                    type: array
                    description: The array of the smartphones
                    items:
                      type: object
                      properties:
                        smartphone_id:
                          type: string
                          description: The ID of the smartphone.
                          example: 3WWAEiEjTj2IQuyDiKMd_A
                        device_name:
                          type: string
                          description: The name of the smartphone.
                          example: EC50
                        device_type:
                          type: string
                          description: The device type of the smartphone.
                          example: Zebra TechnologiesEC50S
                        serial_number:
                          type: string
                          description: The serial number of the smartphone.
                          example: 202355225D0174
                        public_ip:
                          type: string
                          description: The public IPv4 or IPv6 of the smartphone.
                          example: 38.99.100.2
                        activation_status:
                          type: string
                          description: "The activation status of the smartphone. \nThe values of this field can be `Activated`."
                          example: Activated
                          enum:
                          - Activated
                        activation_time:
                          type: string
                          description: 'The time of smartphone activation. If this field is null, the date not available, else this field can format: ''yyyy-MM-ddThh:dd:ssZ''.'
                          example: '2021-10-08T16:12:04Z'
                        assignee:
                          type: object
                          properties:
                            common_area_id:
                              type: string
                              description: The common area ID or common area extension ID.
                              example: JOZmuJ30Spyrw-v9vUzIrA
                            name:
                              type: string
                              description: The display name of the common area.
                              example: test_ca
                            extension_number:
                              type: integer
                              description: The extension number of the common area.
                              example: 123
                          description: The assignee of the smartphone.
                        site:
                          type: object
                          properties:
                            site_id:
                              type: string
                              description: The ID of the [site](https://support.zoom.us/hc/en-us/articles/360020809672).
                              example: NjHmTu16Qfe8yOiNJuekXA
                            name:
                              type: string
                              description: The name of the [site](https://support.zoom.us/hc/en-us/articles/360020809672).
                              example: HQ site
                          description: The [site](https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0069716) of the smartphone.
                  next_page_token:
                    type: string
                    description: The next page token paginates through a large set of results. A next page token returns whenever the set of available results exceeds the current page size. The expiration period for this token is 15 minutes.
                    example: uBTK3NzNksdkuCUAQaFVFd86kyOr59zg4U2
                  page_size:
                    type: integer
                    description: The number of records returned with a single API call.
                    example: 30
                  total_records:
                    type: integer
                    description: The total number of records found for the query across all pages.
                    example: 1
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `400` <br>\n The next page token is invalid or expired. <br>\n"
        '403':
          description: "**HTTP Status Code:** `403` <br>\n Forbidden  \n\n **Error Code:** `403` <br>\n You do not have permission, because the current site `{site_id}` does not belong to the target sites. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:read:admin
        - phone:read:list_devices:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:read:admin
        x-granular-scopes:
        - phone:read:list_devices:admin
