  /phone/shared_line_groups/{sharedLineGroupId}/call_handling/settings/{hourType}:
    patch:
      tags:
      - Shared Line Group
      summary: Update shared line group call handling setting
      description: 'Update the call handling setting of a shared line group for the specified hour type.


        At least one of `call_distribution_setting` or `call_handling_setting` must be provided in the request body. `call_distribution_setting` is only allowed when `hour_type` is `business_hour`.


        **Prerequisites:**

        * A Pro or higher account with a Zoom Phone license.

        * Account owner or admin permissions.


        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:shared_line_group_call_handling_setting:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: updateSharedLineGroupCallHandlingSetting
      parameters:
      - name: sharedLineGroupId
        in: path
        description: The shared line group ID.
        required: true
        schema:
          type: string
          example: qQ3hQmrrR3KhV4XshW6z4Q
      - name: hourType
        in: path
        description: The hour type of the call handling setting. `closed_hours` and `break_hours` cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`.
        required: true
        schema:
          type: string
          example: business_hours
          enum:
          - business_hours
          - closed_hours
          - holiday_hours
          - break_hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                holiday_hour_id:
                  type: string
                  description: The holiday hour ID. Required when `hourType` is `holiday_hours`.
                  example: TNxfEp2WT9emyCsAQt4qnA
                break_hour_id:
                  type: string
                  description: The break hour ID. Required when `hourType` is `break_hours`.
                  example: ULfeE4mgSImyelNmTekUfg
                call_distribution_setting:
                  type: object
                  properties:
                    max_wait_time:
                      type: integer
                      description: The maximum wait time, in seconds, that the shared line group rings all members before the unanswered call action takes effect.
                      example: 30
                      enum:
                      - 7
                      - 10
                      - 15
                      - 20
                      - 25
                      - 30
                      - 35
                      - 40
                      - 45
                      - 50
                      - 55
                      - 60
                  description: The call distribution settings. Only allowed when `hour_type` is `business_hours`.
                call_handling_setting:
                  type: object
                  properties:
                    overflow_action:
                      type: string
                      description: 'The overflow action to take when an incoming call is not answered. This corresponds to the **Overflow** > **Route to** dropdown in the shared line group settings UI:

                        * `forward_to_voicemail` &mdash; Forward to voicemail.

                        * `forward_to_extension` &mdash; Forward to another internal extension. The target extension type is identified by `forward_to_extension.extension_type`.

                        * `forward_to_external_contact` &mdash; Forward to an external contact.

                        * `forward_to_external_number` &mdash; Forward to an external phone number.

                        * `forward_to_zoom_contact_center` &mdash; Forward to a Zoom Contact Center number.

                        * `play_message_then_disconnect` &mdash; Play a message and then disconnect.

                        * `disconnect` &mdash; Disconnect.

                        * `forward_to_teams` &mdash; Forward to a Microsoft Teams Resource Account. Only allowed when the account has Zoom Phone for Microsoft Teams enabled.'
                      example: forward_to_voicemail
                      enum:
                      - forward_to_voicemail
                      - play_message_then_disconnect
                      - forward_to_extension
                      - forward_to_ivr
                      - forward_to_partner_contact_center
                      - forward_to_external_number
                      - forward_to_external_contact
                      - forward_to_zoom_contact_center
                      - forward_to_voicemail_access
                      - forward_to_teams
                      - disconnect
                    overflow_action_setting:
                      description: The overflow action settings based on the `overflow_action` value. Required when `overflow_action` is not `disconnect`.
                      oneOf:
                      - title: Forward to Voicemail
                        type: object
                        properties:
                          allow_callers_check_voicemail:
                            type: boolean
                            description: Whether to allow callers to check voicemail.
                            example: false
                          connect_to_operator:
                            type: boolean
                            description: Whether to allow callers to reach an operator.
                            example: false
                          operator_extension:
                            type: object
                            properties:
                              extension_id:
                                type: string
                                description: The operator's extension ID.
                                example: jN9mb38lQTaMgxUq3Nd6ow
                            description: The operator's extension. Required when `connect_to_operator` is `true`.
                          voicemail_greeting:
                            type: object
                            properties:
                              audio_id:
                                type: string
                                description: The audio prompt file ID.
                                example: yCT14TwySDGVUypVlKNEyA
                            description: The voicemail greeting prompt.
                          leave_voicemail_instruction:
                            type: object
                            properties:
                              audio_id:
                                type: string
                                description: The audio prompt file ID.
                                example: yCT14TwySDGVUypVlKNEyA
                            description: The leave voicemail instruction prompt. This only takes effect when `connect_to_operator` or `allow_callers_check_voicemail` is `true`.
                        description: Provide this object when `overflow_action` is `forward_to_voicemail`.
                      - title: Forward to Another Extension
                        type: object
                        properties:
                          forward_to_extension:
                            required:
                            - extension_id
                            type: object
                            properties:
                              extension_id:
                                type: string
                                description: The extension ID to forward calls to.
                                example: jN9mb38lQTaMgxUq3Nd6ow
                            description: The extension to forward calls to.
                        description: Provide this object when `overflow_action` is `forward_to_extension`.
                      - title: Forward to External Contact
                        type: object
                        properties:
                          forward_to_external_contact:
                            required:
                            - external_contact_id
                            type: object
                            properties:
                              external_contact_id:
                                type: string
                                description: The external contact's ID.
                                example: OJGi5xOFQPmrJbKg68-iWg
                            description: The external contact to forward calls to.
                        description: Provide this object when `overflow_action` is `forward_to_external_contact`.
                      - title: Forward to External Number
                        required:
                        - forward_phone_number
                        type: object
                        properties:
                          forward_phone_number:
                            type: string
                            description: The external phone number to forward calls to in [E.164 format](https://en.wikipedia.org/wiki/E.164).
                            example: '+12058945656'
                        description: Provide this object when `overflow_action` is `forward_to_external_number`.
                      - title: Forward to Zoom Contact Center
                        type: object
                        properties:
                          forward_to_zoom_contact_center:
                            required:
                            - zoom_contact_center_number
                            type: object
                            properties:
                              zoom_contact_center_number:
                                type: string
                                description: The Zoom Contact Center phone number to forward calls to in [E.164 format](https://en.wikipedia.org/wiki/E.164).
                                example: '+12058945656'
                            description: The Zoom Contact Center number to forward calls to.
                        description: Provide this object when `overflow_action` is `forward_to_zoom_contact_center`.
                      - title: Play a Message then Disconnect
                        type: object
                        properties:
                          message_greeting:
                            type: object
                            properties:
                              audio_id:
                                type: string
                                description: The audio prompt file ID.
                                example: yCT14TwySDGVUypVlKNEyA
                            description: The message audio prompt played before disconnecting.
                        description: Provide this object when `overflow_action` is `play_message_then_disconnect`.
                      - title: Forward to Microsoft Teams Resource Account
                        type: object
                        properties:
                          forward_to_teams:
                            required:
                            - teams_app_id
                            type: object
                            properties:
                              teams_app_id:
                                type: string
                                description: The Microsoft Teams Resource Account ID.
                                example: OJGi5xOFQPmrJbKg68-iWg
                            description: The Microsoft Teams Resource Account to forward calls to.
                        description: Provide this object when `overflow_action` is `forward_to_teams`. Only allowed when the account has Zoom Phone for Microsoft Teams enabled.
                  description: The call handling settings.
      responses:
        '204':
          description: '**HTTP Status Code:** `204` Shared line group call handling setting updated successfully.'
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `15101` <br>\n Break hour does not exist: {breakHourId}. <br>\n**Error Code:** `15102` <br>\n Holiday hour does not exist: {holidayHourId}. <br>\n**Error Code:** `13802` <br>\n Audio does not exist: {audioId}. <br>\n**Error Code:** `13808` <br>\n Extension does not exist: {extension_id}. <br>\n**Error Code:** `13810` <br>\n External contact does not exist: {0}. <br>\n**Error Code:** `15104` <br>\n The {hour_type} cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n Shared line group does not exist: {sharedLineGroupId}. <br>\n"
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:update:shared_line_group_call_handling_setting:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:update:shared_line_group_call_handling_setting:admin
