  /phone/shared_line_groups/{slgId}/policies/{policyType}:
    post:
      tags:
      - Shared Line Group
      summary: Add a policy setting to a shared line group
      description: "Adds the policy sub-setting for a specific [shared line group](https://support.zoom.us/hc/en-us/articles/360038850792) according to the `policyType`. For example, you can use this API to set up shared access members. **Prerequisites:** * Pro or higher account with Zoom Phone license.* Account owner or admin privileges \n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:shared_line_group_policy:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`"
      operationId: addSLGPolicySubSetting
      parameters:
      - name: slgId
        in: path
        description: The slg ID.
        required: true
        schema:
          type: string
          example: loiSdBeXS-iL-QERBqE8Sg
      - name: policyType
        in: path
        description: 'This setting corresponds to tbe policy item you wish to add. Allowed values: `voice_mail`.'
        required: true
        schema:
          type: string
          example: voice_mail
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                voicemail_access_members:
                  maxItems: 10
                  uniqueItems: true
                  type: array
                  description: The shared voicemail access member list.
                  items:
                    type: object
                    properties:
                      access_user_id:
                        type: string
                        description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or the unique identifier of the common area, depending on the access user type.
                        example: w0RChiauQeqRlv5fgxYULQ
                      access_user_type:
                        type: string
                        description: 'The extension type of the member to be added in the shared voicemail access member list. The default type will be user if empty. Allowed: user | commonArea.'
                        example: commonArea
                        enum:
                        - commonArea
                        - user
                      allow_download:
                        type: boolean
                        description: Whether the member has download permissions. Not applicable to `commonArea`. The default is **false**.
                        example: false
                      allow_delete:
                        type: boolean
                        description: Whether the member has delete permissions. The default is **false**.
                        example: false
                      allow_sharing:
                        type: boolean
                        description: Whether the member has permission to share. The default is **false**.
                        example: false
      responses:
        '201':
          description: "**HTTP Status Code** `201`   \n \nCreated Successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  voicemail_access_members:
                    maxItems: 10
                    uniqueItems: true
                    type: array
                    description: The shared access member list.
                    items:
                      allOf:
                      - allOf:
                        - type: object
                          properties:
                            access_user_id:
                              type: string
                              description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or unique identifier of the common area depending on the access user type.
                              example: w0RChiauQeqRlv5fgxYULQ
                            access_user_type:
                              type: string
                              description: 'The extension type of the member to be added in the shared voicemail access member list. Allowed: user | commonArea.'
                              example: commonArea
                              enum:
                              - commonArea
                              - user
                            allow_download:
                              type: boolean
                              description: Whether the member has download permissions. Not applicable to `commonArea`. The default is **false**.
                              example: false
                            allow_delete:
                              type: boolean
                              description: Whether the member has delete permissions. The default is **false**.
                              example: false
                            allow_sharing:
                              type: boolean
                              description: Whether the member has permission to share. The default is **false**.
                              example: false
                        - type: object
                          properties:
                            shared_id:
                              type: string
                              description: The shared voicemail ID that the member can access.
                              example: --e8ugg0SeS-9clgrDkn2w
                      - type: object
                        properties:
                          access_user_type:
                            type: string
                            description: 'The type of access member: `user` or `commonArea`.'
                            example: user
                            enum:
                            - user
                            - commonArea
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `400` <br>\n The number of items for voicemail_access_members must not exceed 10. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n Shared line group does not exist: {0}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write:shared_line_group_policy:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:write:shared_line_group_policy:admin
    delete:
      tags:
      - Shared Line Group
      summary: Delete an SLG policy setting
      description: "Removes the policy sub-setting for a specific [shared line group](https://support.zoom.us/hc/en-us/articles/360038850792) according to the `policyType`. For example, you can use this API to remove shared access members. **Prerequisites:** * Pro or higher account with Zoom Phone license.* Account owner or admin privileges \n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:delete:shared_line_group_policy:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: removeSLGPolicySubSetting
      parameters:
      - name: slgId
        in: path
        description: The shared line group ID.
        required: true
        schema:
          type: string
          example: ''
      - name: policyType
        in: path
        description: 'This setting corresponds to tbe policy item you wish to remove. Allowed values: `voice_mail`.'
        required: true
        schema:
          type: string
          example: voice_mail
      - name: shared_ids
        in: query
        description: The comma separated list of shared IDs to remove. The number is limited to the minimum value of 10 or the number of allowed access members account setting.
        required: true
        schema:
          maxItems: 20
          type: array
          example: []
          items:
            type: string
            example: 8_RkKw9OQ42oYsXqJJjs4A
      responses:
        '204':
          description: "**HTTP Status Code:** `204`  \n \nNo Content  \n "
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n "
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:delete:shared_line_group_policy:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:delete:shared_line_group_policy:admin
    patch:
      tags:
      - Shared Line Group
      summary: Update an SLG policy setting
      description: "Updates the policy sub-setting for a specific [shared line group](https://support.zoom.us/hc/en-us/articles/360038850792) according to the `policyType`. For example, you can use this API to update shared access members. \n\n**Prerequisites:** \n* Pro or higher account with Zoom Phone license.\n* Account owner or admin privileges \n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:shared_line_group_policy:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: updateSLGPolicySubSetting
      parameters:
      - name: slgId
        in: path
        required: true
        schema:
          type: string
      - name: policyType
        in: path
        description: 'This setting corresponds to tbe policy item you wish to update. Allowed values: `voice_mail`.'
        required: true
        schema:
          type: string
          example: voice_mail
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                voicemail_access_members:
                  maxItems: 10
                  type: array
                  description: The shared voicemail access member list.
                  items:
                    allOf:
                    - type: object
                      properties:
                        access_user_id:
                          type: string
                          description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or the unique identifier of the common area, depending on the access user type.
                          example: w0RChiauQeqRlv5fgxYULQ
                        access_user_type:
                          type: string
                          description: 'The extension type of the member to be added in the shared voicemail access member list. The default type will be user if empty. Allowed: user | commonArea.'
                          example: commonArea
                          enum:
                          - commonArea
                          - user
                        allow_download:
                          type: boolean
                          description: Whether the member has download permissions. Not applicable to `commonArea`. The default is **false**.
                          example: false
                        allow_delete:
                          type: boolean
                          description: Whether the member has delete permissions. The default is **false**.
                          example: false
                        allow_sharing:
                          type: boolean
                          description: Whether the member has permission to share. The default is **false**.
                          example: false
                    - type: object
                      properties:
                        shared_id:
                          type: string
                          description: The shared voicemail ID that the member can access.
                          example: --e8ugg0SeS-9clgrDkn2w
      responses:
        '204':
          description: "**HTTP Status Code:** `204`  \n \nNo Content  \n "
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Validation failed. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n Shared line group does not exist: {0}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:update:shared_line_group_policy:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:update:shared_line_group_policy:admin
