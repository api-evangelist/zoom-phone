  /phone/shared_line_groups/{sharedLineGroupId}/settings:
    get:
      tags:
      - Shared Line Group
      summary: Get shared line group settings
      description: 'Returns shared line group settings.


        **Prerequisites:**

        * A Pro or higher account with a Zoom Phone license.

        * Account owner or admin permissions.




        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:shared_line_group_setting:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: getSharedLineGroupSettings
      parameters:
      - name: sharedLineGroupId
        in: path
        description: The shared line group ID.
        required: true
        schema:
          type: string
          example: qQ3hQmrrR3KhV4XshW6z4Q
      - name: setting_type
        in: query
        description: 'The setting item to query. Defaults to `business_hours` if not provided. Allowed values: `holiday_hours`, `business_hours`, `break_hours`.'
        required: false
        schema:
          type: string
          example: business_hours
          enum:
          - holiday_hours
          - business_hours
          - break_hours
      responses:
        '200':
          description: "**HTTP Status Code:** `200`  \n \nShared line group setting object returned."
          content:
            application/json:
              schema:
                description: The shared line group setting.
                oneOf:
                - title: Holiday hour settings
                  type: object
                  properties:
                    holiday_hours:
                      type: array
                      description: The holiday list. The minimum is one item, and the maximum is 10 items.
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: The name of the holiday.
                            example: holiday name
                          from:
                            type: string
                            description: The holiday's start date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                            example: '2022-03-05T00:00:00Z'
                          to:
                            type: string
                            description: The holiday's end date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                            example: '2022-03-06T00:00:00Z'
                        description: Each holiday.
                  description: Returned only when the setting type is `holiday_hours`.
                - title: Business hour settings
                  type: object
                  properties:
                    business_hours_settings:
                      type: object
                      properties:
                        business_hours:
                          maxItems: 7
                          type: array
                          description: The business hours settings.
                          items:
                            type: object
                            properties:
                              from:
                                type: string
                                description: The business hours start time in `HH:mm` format.
                                example: 09:00
                              to:
                                type: string
                                description: The business hours end time in `HH:mm` format.
                                example: '18:00'
                              type:
                                type: integer
                                description: "The type of business hours: \n* `0` &mdash; Disabled. \n* `1` &mdash; 24 hours. \n* `2` &mdash; Customized hours."
                                example: 1
                                enum:
                                - 0
                                - 1
                                - 2
                              weekday:
                                type: integer
                                description: "The day of the week: \n* `1` &mdash; Sunday \n* `2` &mdash; Monday \n* `3` &mdash; Tuesday \n* `4` &mdash; Wednesday \n* `5` &mdash; Thursday \n* `6` &mdash; Friday \n* `7` &mdash; Saturday"
                                example: 7
                                enum:
                                - 1
                                - 2
                                - 3
                                - 4
                                - 5
                                - 6
                                - 7
                        business_hour_type:
                          type: integer
                          description: "The type of business hours: \n* `1` &mdash; 24 hours, 7 days a week. \n* `2` &mdash; Customized hours."
                          example: 2
                          enum:
                          - 1
                          - 2
                      description: The business hours settings.
                  description: Returned only when the setting type is `business_hours`.
                - title: Break hour settings
                  type: object
                  properties:
                    break_hours:
                      type: array
                      description: The list of break hours.
                      items:
                        type: object
                        properties:
                          break_hour_id:
                            type: string
                            description: The unique identifier of the break hour.
                            example: R4GeDFaLTpeQb1jPDCuPhA
                          break_hour_name:
                            maxLength: 255
                            minLength: 1
                            type: string
                            description: The name of the break hour.
                            example: Lunch Break
                          break_hour_type:
                            type: string
                            description: "The type of break hour schedule: \n* `every_business_day` &mdash; The break applies at the same time on every business day. \n* `custom_hours` &mdash; The break applies on specific days of the week with individually configured times."
                            example: every_business_day
                            enum:
                            - every_business_day
                            - custom_hours
                          break_hour_setting:
                            description: The break hour time configuration. The structure depends on the `break_hour_type` field.
                            oneOf:
                            - title: Every Business Day
                              required:
                              - from
                              - to
                              type: object
                              properties:
                                from:
                                  type: string
                                  description: The start time of the break in `HH:mm` format (24-hour clock). For example, `12:00`.
                                  example: '12:00'
                                to:
                                  type: string
                                  description: The end time of the break in `HH:mm` format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                  example: '13:00'
                              description: Only returned when `break_hour_type` is `every_business_day`. Defines a single time range that applies to all business days.
                            - title: Custom Hours
                              required:
                              - days
                              type: object
                              properties:
                                days:
