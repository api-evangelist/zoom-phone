  /phone/shared_line_groups/{slgId}/members:
    post:
      tags:
      - Shared Line Group
      summary: Add members to a shared line group
      description: "[Adds members](https://support.zoom.us/hc/en-us/articles/360038850792-Setting-up-shared-line-groups#h_7cb42370-48f6-4a8f-84f4-c6eee4d9f0ca) to a shared line group. A [shared line group](https://support.zoom.us/hc/en-us/articles/360038850792) allows Zoom Phone admins to share a phone number and extension with a group of phone users or common areas. This gives members of the shared line group access to the group's direct phone number and voicemail.  Note that a member can only be added to one shared line group. \n\n**Prerequisites:**   \n \n* Pro or higher account with Zoom Phone license.\n* A valid Shared Line Group\n* Account owner or admin privileges \n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:shared_line_member:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: addMembersToSharedLineGroup
      parameters:
      - name: slgId
        in: path
        description: The shared line group ID.
        required: true
        schema:
          type: string
          example: uvsOCaiDQR2M-NviKFHo0w
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                members:
                  type: object
                  properties:
                    common_area_ids:
                      type: array
                      description: The unique identifier of the [common area](https://marketplace.zoom.us/docs/api-reference/phone/methods/#operation/listCommonAreas), retrievable from the List Common Areas API.
                      items:
                        type: string
                        example: iewGNg-LSYa0ghhkr4d0Hg
                    users:
                      type: array
                      description: The Zoom Phone users on the account.
                      items:
                        type: object
                        properties:
