                      locked:
                        type: boolean
                        description: Whether the senior administrator allows users to modify the current settings.
                        example: false
                      locked_by:
                        type: string
                        description: Which level has locked this setting.
                        example: invalid
                        enum:
                        - invalid
                        - account
                        - site
                      modified:
                        type: boolean
