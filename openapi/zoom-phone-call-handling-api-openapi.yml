                        example: 8fd2159d-2495-4ec4-8101-7a182f2da802
                      wrap_up_time:
                        type: integer
                        description: "The wrap up time in seconds. \nSpecify the duration before the next queue call is routed to a member in call queue:\n* `0` \n* `10` \n* `15` \n* `20` \n* `25` \n* `30` \n* `35` \n* `40` \n* `45` \n* `50` \n* `55` \n* `60` \n* `120` \n* `180` \n* `240` \n* `300`\n\nThis is only required for the `call_handling` sub-setting."
                        example: 25
                        enum:
                        - 10
                        - 15
                        - 20
                        - 25
                        - 30
                        - 35
                        - 40
                        - 45
                        - 50
                        - 55
                        - 60
                        - 120
                        - 180
                        - 240
                        - 300
                  sub_setting_type:
                    type: string
                    description: "The type of sub-setting: \n* `call_handling`"
                    example: call_handling
                    enum:
                    - call_handling
      responses:
        '204':
          description: "**HTTP Status Codes** `204`  \n Call handling settings successfully updated."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `400` <br>\n Since 'Allow callers to reach an operator' and 'Allow callers to check voicemail' are disabled, you can't update the voicemail leaving instruction. <br>\n**Error Code:** `400` <br>\n The forwarding of busy on another call and the forwarding of unanswered calls are both not set to 'Forward to voicemail/videomail', so you can't update the voicemail leaving instruction. <br>\n**Error Code:** `400` <br>\n Invalid customer hours from/to time for weekday: {weekday}. <br>\n**Error Code:** `400` <br>\n Invalid holiday from/to time. <br>\n**Error Code:** `400` <br>\n Failed to overflow to an external contact since the user overflow policy is restricted. <br>\n**Error Code:** `400` <br>\n Failed to overflow to an external number since the user overflow policy is restricted. <br>\n**Error Code:** `400` <br>\n Failed to overflow to an internal extension without inbound Automatic Call Recording since the user overflow policy is restricted. <br>\n**Error Code:** `400` <br>\n Failed to overflow to an extension since the user overflow policy is disabled. <br>\n**Error Code:** `400` <br>\n The extension's voicemail policy is disabled. <br>\n**Error Code:** `400` <br>\n You cannot assign yourself as the operator. <br>\n**Error Code:** `400` <br>\n The user business hours ring mode and max wait time need to be set together. <br>\n**Error Code:** `405` <br>\n The number of items for custom_hours_settings must not exceed 7. <br>\n**Error Code:** `405` <br>\n The number of items for call_forwarding_settings must not exceed 10. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n Call forwarding does not exist: {callForwardingId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
