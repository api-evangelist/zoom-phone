 Extension does not exist: {extension_id} <br>\n**Error Code:** `405` <br>\n The number of items for short_extension.ranges must not exceed 10. <br>\n**Error Code:** `405` <br>\n The number of items for policy.zoom_phone_on_mobile.allow_calling_clients must not exceed 10. <br>\n**Error Code:** `405` <br>\n The number of items for policy.zoom_phone_on_mobile.allow_sms_mms_clients must not exceed 10. <br>\n**Error Code:** `405` <br>\n The number of items for policy.call_queue_opt_out_reason.call_queue_opt_out_reasons_list must not exceed 30. <br>\n**Error Code:** `405` <br>\n The number of items for policy.auto_delete_data_after_retention_duration.items must not exceed 15. <br>\n**Error Code:** `405` <br>\n The number of items for policy.sms_template.sms_template_list must not exceed 50. <br>\n**Error Code:** `405` <br>\n The number of items for policy.sms.international_sms_countries must not exceed 200. <br>\n**Error Code:** `405` <br>\n The number of items for policy.zoom_phone_on_desktop.allow_calling_clients must not exceed 10 <br>\n**Error Code:** `405` <br>\n The number of items for policy.zoom_phone_on_desktop.allow_sms_mms_clients must not exceed 10. <br>\n"
