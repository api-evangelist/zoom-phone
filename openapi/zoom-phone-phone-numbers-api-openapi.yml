    patch:
      tags:
      - Phone Numbers
      summary: Update a phone number
      description: "Updates a Zoom Phone number's information.\n\n**Prerequisites:** \n* A Paid account\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:number:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: updatePhoneNumberDetails
      parameters:
      - name: phoneNumberId
        in: path
        description: The unique identifier of the phone number.
        required: true
        schema:
          type: string
          example: uvsOCaiDQR2M-NviKFHo0w
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                capability:
                  maxItems: 2
                  type: array
                  description: 'THe phone number''s capability. Values: `outgoing` or `incoming`. Add one or both.'
                  items:
                    type: string
                    example: incoming
                display_name:
                  type: string
                  description: The phone number display name.
                  example: Display Name
                emergency_address_status:
                  type: integer
                  description: This field confirms BYOC phone number's emergency address status. 2-confirmed
                  example: 1
                sip_group_id:
                  type: string
                  description: The SIP group ID, only used for BYOC phone number update.
                  example: 8MhK7ea4Q4ihIQ4TD_g0kw
      responses:
        '204':
          description: "**HTTP Status Code:** `204`  \n \nNo Content"
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n The value of capability is invalid. Provide a valid capability and try again.\nYou cannot update it to a non-BYOC trunk group, because some BYOC numbers are using the SIP Group.\nThe phone number is not in binding.\nThe phone number is not BYOC phone number. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n Phone number does not exist. ID: {0}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      deprecated: true
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:update:number:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:update:number:admin
    servers:
    - url: https://api.zoom.us/v2
  /phone/users/{userId}/phone_numbers:
    post:
      tags:
      - Phone Numbers
      summary: Assign a phone number to a user
      description: 'Assigns a [phone number](https://support.zoom.us/hc/en-us/articles/360020808292-Managing-Phone-Numbers) to a user who has already enabled Zoom Phone.**Prerequisites:** * A Business or Enterprise account * A Zoom Phone license


        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write`,`phone:write:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:user_number`,`phone:write:user_number:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: assignPhoneNumber
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          example: IqoQmDRqS-aIoXqV_FZ88w
      requestBody:
        description: Provide either the ID or phone number in the request body.
        content:
          application/json:
            schema:
              type: object
              properties:
                phone_numbers:
                  maxItems: 10
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID for phone number
                        example: iHE1MQAET2iV85MbfaQmwg
                      number:
                        type: string
                        description: Phone number in E164 format.
                        example: '+18887193005'
      responses:
        '200':
          description: "**HTTP Status Code:** `200`   \n \nPhone number assigned successfully. \n"
          content:
            application/json:
              schema:
                type: object
                properties:
                  phone_numbers:
                    maxItems: 10
                    type: array
                    description: Assigned phone number
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: ID of the phone number
                          example: iHE1MQAET2iV85MbfaQmwg
                        number:
                          type: string
                          description: The phone number that is assigned to the user.
                          example: '+18887193005'
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Invalid user id. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n This user does not exist: {userId}. <br>\n**Error Code:** `2001` <br>\n Account does not exist. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
