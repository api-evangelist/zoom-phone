  /number_management/allocation:
    patch:
      tags:
      - Phone Numbers
      summary: Allocate/Unallocate phone numbers
      description: 'Allocates or unallocates phone numbers for those with CPL routing.


        <p>Note: When allocating phone numbers, if there are any native numbers, they must belong to the same country or region, and have the same number plan.</p>


        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `number_management_numbers:write:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `number_management:write:numbers:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `HEAVY`'
      operationId: AllocateNumber
      requestBody:
        content:
          application/json:
            schema:
              required:
              - allocated_product
              - numbers
              type: object
              properties:
                numbers:
                  maxItems: 10
                  type: array
                  description: A list of phone numbers.
                  items:
                    type: string
                    description: The phone number ID.
                    example: 8nObzGKRTGxoNDZ5JIEHQ
                allocated_product:
                  type: string
                  description: The phone number's allocated product. Use the value UNALLOCATED to unallocate phone numbers.
                  example: ZOOM_PHONE
                  enum:
                  - ZOOM_PHONE
                  - ZOOM_CONTACT_CENTER
                  - UNALLOCATED
                site_id:
                  type: string
                  description: The site the numbers will be allocated for Zoom Phone.
                  example: 8nObzGKRTGxoNDZ5JIEHQ
      responses:
        '204':
          description: ' The phone numbers have been allocated succeefully'
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  Invalid parameter or operation \n\n **Error Code:** `100002` <br>\n Phone number not found <br>\n**Error Code:** `200002` <br>\n Unable to switch products for the number <br>\n**Error Code:** `1002010` <br>\n The site does not exist <br>\n"
        '401':
          description: "**HTTP Status Code:** `401` <br>\n Unauthorized  Lack of valid authentication \n\n "
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - number_management_numbers:write:admin
        - number_management:write:numbers:admin
        openapi_authorization: []
      x-extensions:
        x-permissions:
        - PbxAdmin:Edit
        - ContactCenterMgt:Edit
        x-macro-scopes:
        - number_management_numbers:write:admin
        x-granular-scopes:
        - number_management:write:numbers:admin
    servers:
    - url: https://api.zoom.us/v2
  /number_management/byoc_numbers:
    post:
      tags:
      - Phone Numbers
      summary: Add BYOC phone numbers
      description: "Adds BYOC (Bring Your Own Carrier) phone numbers to Zoom Phone.\n\n**Prerequisites:** \n* A Business or Enterprise plan \n* A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `number_management_numbers:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `number_management:write:byoc_numbers:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`"
      operationId: AddBYOCPhoneNumber
      requestBody:
        content:
          application/json:
            schema:
              required:
              - allocated_product
              - phone_numbers
              type: object
              properties:
                allocated_product:
                  type: string
                  description: The partners can allocate phone numbers for exclusive use by a specific Zoom Product (ZOOM_PHONE or ZOOM_CONTACT_CENTER).
                  example: ZOOM_PHONE
                  enum:
                  - ZOOM_PHONE
                  - ZOOM_CONTACT_CENTER
                country_iso:
                  type: string
                  description: "The two-lettered country code (Alpha-2 code in ISO-3166 format). \n- When the input number is a local number, country_iso is required. \n- When the input number is a E164 number, `country_iso` is optional."
                  example: US
                site_id:
                  type: string
                  description: 'The unique identifier of the site. This field is only required if you have enabled multiple sites in the account. See [Managing multiple sites](https://support.zoom.us/hc/en-us/articles/360020809672-Managing-multiple-sites) or [Adding a site](https://support.zoom.us/hc/en-us/articles/360020809672-Managing-multiple-sites#h_05c88e35-1593-491f-b1a8-b7139a75dc15) for details.

                    - If add a zoom phone number, and multiple sites is  enabled, `site_id` is required'
                  example: 8f71O6rWT8KFUGQmJIFAdQ
                phone_numbers:
                  maxItems: 100
                  type: array
                  description: Whether a input local number or E164 number.
                  items:
                    type: string
                    example: '+8618251885564'
                sip_group_id:
                  type: string
                  description: 'The SIP group ID.

                    - If adding a Zoom Phone number, and BYOC SIP Group is optional, `sip_group_id` is required. It can input  ZOOM_PHONE or COMMON `sip_group_id`

                    - If adding a Zoom Contact Center number, `sip_group_id` is required, and can input ZOOM_CONTACT_CENTER or COMMON `sip_group_id`. '
                  example: FLofRFDxSNiSd68iRZrZmg
                enable_pci_pal:
                  type: boolean
                  description: '- If you add a Zoom phone number and want to enable `enable_pci_pal`, you first need to enable Enable Compliance APIs in the Zoom Phone OP.

                    - If you add a Zoom Contact Center number and want to enable `enable_pci_pal`, you first need to enable PCI SIP Integration in the Zoom Contact Center OP.'
                  example: true
      responses:
        '201':
          description: '**HTTP Status Code:** `201` **Created**   BYOC phone numbers successfully added. '
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `1000` <br>\n Some data failed.for example: [ {\"phoneNumber\":\"+12098888111\",\"reason\":\"Phone Number format invalid\"}, {\"phoneNumber\":\"+12090000011\",\"reason\":\"Phone Number already exists\"} ] <br>\n**Error Code:** `1004` <br>\n BYOC Phone Numbers are not enabled for this account <br>\n**Error Code:** `1003_001` <br>\n Too many numbers, should less than 100,contact zoom support team for more numbers <br>\n**Error Code:** `100_001` <br>\n Sip Group not found <br>\n**Error Code:** `200_005` <br>\n Current sip group don't support PCIPal <br>\n**Error Code:** `1002_003` <br>\n Site cannot be empty in zoom phone <br>\n**Error Code:** `1002_010` <br>\n The site does not exist <br>\n"
        '403':
          description: "**HTTP Status Code:** `403` <br>\n Forbidden  You do not have permission. \n\n "
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - number_management_numbers:write:admin
        - number_management:write:byoc_numbers:admin
        openapi_authorization: []
      x-extensions:
        x-permissions:
        - PbxAdmin:Edit
        - ContactCenterMgt:Edit
        x-macro-scopes:
        - number_management_numbers:write:admin
        x-granular-scopes:
        - number_management:write:byoc_numbers:admin
    servers:
    - url: https://api.zoom.us/v2
  /number_management/numbers:
    get:
      tags:
      - Phone Numbers
      summary: List phone numbers
      description: 'Returns a list of phone numbers in an account. See section <b>Information in the phone number table</b> of [Using Number Management for managing phone numbers](https://support.zoom.com/hc/en/article?id=zm_kb&sysparm_article=KB0074457#h_60222313850311712763891581) for more details.


        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `number_management_numbers:read:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `number_management:read:list_numbers:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: listPhoneNumbers
      parameters:
      - name: page_size
        in: query
        description: The number of records returned within a single API call.
        required: false
        schema:
          maximum: 200
          type: integer
          example: 30
          default: 30
      - name: next_page_token
        in: query
        description: The next page token paginates through a large set of results. A next page token returns whenever the set of available results exceeds the current page size. The expiration period for this token is 15 minutes.
        required: false
        schema:
          type: string
          example: Fh98ehf98wehf9wehfhw
      - name: allocated_product
        in: query
        description: The product associated with the allocated number.
        required: false
        schema:
          type: string
          example: ZOOM_PHONE
          enum:
          - UNALLOCATED
          - ZOOM_PHONE
          - ZOOM_CONTACT_CENTER
      - name: number_type
        in: query
        description: The type of phone number.
        required: false
        schema:
          type: string
          example: Toll
          enum:
          - Toll
          - TollFree
          - VirtualService
          - Mobile
          - SharedCost
          - National
          - ITFS
      - name: number_status
        in: query
        description: The status of phone number.
        required: false
        schema:
          type: string
          example: Normal
          enum:
          - Normal
          - Pending
      - name: number_source
        in: query
        description: The source of phone number.
        required: false
        schema:
          type: string
          example: Zoom
          enum:
          - Zoom
          - ZoomPorted
          - ZoomReserved
          - ThirdPartyNumber
          - BYOCCloud
          - BYOCPremises
      - name: site_id
        in: query
        description: The site ID for the Zoom phone number.
        required: false
        schema:
          type: string
      - name: assigned_to_type
        in: query
        description: The type of target assigned to the number.
        required: false
        schema:
          type: string
          example: User
          enum:
          - PhoneUnassigned
          - User
          - CallQueue
          - AutoReceptionist
          - CiscoPolycomRoom
          - SharedLineGroup
          - GroupCallPickup
          - CommonArea
          - EmergencyNumberPool
          - CompanyLocation
          - PersonalLocation
          - MeetingService
          - LocalSurvivability
          - LocalSurvivabilityEmergencyNumberPool
          - MicrosoftTeamsResourceAccount
          - DistributionGroup
          - ContactCenterUnassigned
          - DialInToVideoEngagements
          - DefaultSystemOutgoingSMS
          - DefaultAgentOutgoingSMS
          - DefaultCallerID
          - Voice
          - SMS
      - name: keyword
        in: query
        description: This field allows you to search by phone number. Only prefix matching is available for search.
        required: false
        schema:
          type: string
          example: '1205'
      responses:
        '200':
          description: The list of phone numbers.
          content:
            application/json:
              schema:
                type: object
                properties:
                  next_page_token:
                    type: string
                    description: The next page token paginates through a large set of results. A next page token returns whenever the set of available results exceeds the current page size. The expiration period for this token is 15 minutes.
                    example: xuWXDDeGFkx0dyRtuwQR3M9NWIoMVD9e0a2
                  page_size:
                    type: integer
                    description: The page size in use.
                    example: 100
                  numbers:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          description: The unique identifier of the phone number.
                          example: iHE1MQAET2iV85MbfaQmwg
                        number:
                          type: string
                          description: The phone number in E.164 format.
                          example: '+1203030333'
                        allocated_product:
                          type: string
                          description: The product assigned to the phone number.
                          example: ZOOM_CONTACT_CENTER
                          enum:
