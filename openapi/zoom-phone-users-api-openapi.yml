      summary: Get a user's profile settings
      description: "Returns the Zoom Phone [profile settings](https://support.zoom.us/hc/en-us/articles/360021325712-Configuring-Settings) of a user. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\n**Prerequisites** \n* A Business or Enterprise account \n* A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read`,`phone:read:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:user_setting:admin`,`phone:read:user_setting`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: phoneUserSettings
      parameters:
      - name: userId
        in: path
        description: The user ID or email address of the user. For user-level apps, pass `me` as the value for userId.
        required: true
        schema:
          type: string
          example: DYHrdpjrS3uaOf7dPkkg8w
      responses:
        '200':
          description: '**HTTP Status Code:** `200`


            User Setting object returned.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  area_code:
                    type: string
                    description: The area code of user.
                    example: '01'
                  audio_prompt_language:
                    type: string
                    description: "The audio prompt language code.  \n  American English: `en-US`  \n \nBritish English: `en-GB`  \n \nEspa&ntilde;ol americano: `es-US`  \n \nFran&ccedil;ais canadien: `fr-CA`  \n \nDansk: `da-DK`  \n \nDeutsch: `de-DE`  \n \nEspa&ntilde;ol: `es-ES`  \n \nFran&ccedil;ais: `fr-FR`  \n \nItaliano: `it-IT`  \n \nNederlands: `nl-NL`  \n \nPortugues portugal: `pt-PT`  \n \nJapanese: `ja-JP`  \n \nKorean: `ko-KO`  \n \nPortugues brasil: `pt-BR`  \n \nChinese: `zh-CN`  \n \nTaiwanese: `zh-TW`  \n "
                    example: en-US
                  default_transcription_language:
                    type: string
                    description: "The default language selection for features such as voicemail and call recording.\n* `en-US` : English (US) \n* `en-GB` : English (UK) \n* `es-US` : Spanish (US) \n* `fr-CA` : French (Canada) \n* `da-DK` : Danish (Denmark) \n* `de-DE` : German (Germany) \n* `es-ES` : Spanish (Spain) \n* `fr-FR` : French (France) \n* `it-IT` : Italian (Italy) \n* `nl-NL` : Dutch (Netherlands) \n* `pt-PT` : Portuguese (Portugal) \n* `ja` : Japanese \n* `ko-KR` : Korean (Korea) \n* `pt-BR` : Portuguese (Brazil) \n* `zh-CN` : Chinese (PRC)"
                    example: en-US
                    enum:
                    - en-US
                    - en-GB
                    - es-US
                    - fr-CA
                    - da-DK
                    - de-DE
                    - es-ES
                    - fr-FR
                    - it-IT
                    - nl-NL
                    - pt-PT
                    - ja
                    - ko-KR
                    - pt-BR
                    - zh-CN
                  company_number:
                    type: string
                    description: The [company number](https://support.zoom.us/hc/en-us/articles/360028553691) can be used by external callers to reach your phone users (by dialing the main company number and the user's extension). It can also be used by phone users as their caller ID when making calls.
                    example: '+12058945640'
                  country:
                    type: object
                    properties:
                      code:
                        type: string
                        description: The two lettered country [code](https://marketplace.zoom.us/docs/api-reference/other-references/abbreviation-lists#countries).
                        example: US
                      country_code:
                        type: string
                        description: The country's calling code.
                        example: '1'
                      name:
                        type: string
                        description: The site's country name.
                        example: United States
                    description: The site's country.
                  delegation:
                    type: object
                    properties:
                      assistants:
                        maxItems: 15
                        type: array
                        description: The delegation assistants.
                        items:
                          type: object
                          properties:
                            display_name:
                              type: string
                              description: The display name.
                              example: test user delegation
                            extension_id:
                              type: string
                              description: The extension's ID.
                              example: CcrEGgmeQem1uyJsuIRKwA
                            extension_number:
                              type: integer
                              description: The extension's number.
                              format: int64
                              example: 1000123477
                            extension_type:
                              type: string
                              description: 'The extension''s type: `user` or `commonArea`.'
                              example: user
                            id:
                              type: string
                              description: The user or common area ID.
                              example: fWOgOALdT1ei4vjXK-QYsA
                      privacy:
                        type: boolean
                        description: Whether to allow members to prevent others from picking up a held call, and listening, whispering, barging, or taking over a call if it's configured.
                        example: true
                      privileges:
                        maxItems: 10
                        type: array
                        description: The delegation privileges. 1-Place Calls, 2-Answer Calls, 3-Pick Up Hold Calls, 4-Manage VIP Contacts, 5-Opt In/Out, 6-Join and Merge Calls, 7-Set Business Hours.
                        items:
                          type: integer
                          example: 2
                        enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                      locked:
                        type: boolean
                        description: Whether to allow users to access to the feature of delegation.
                        example: true
                    description: The user delegation.
                  desk_phone:
                    type: object
                    properties:
                      devices:
                        maxItems: 10
                        type: array
                        description: The information about the desk phones.
                        items:
                          type: object
                          properties:
                            device_type:
                              type: string
                              description: The device type, including the manufacturer and the model name.
                              example: Yealink t42s
                            display_name:
                              type: string
                              description: The display name of the device.
                              example: ApiTA_Device_2020_12_14_22_59_31_749
                            id:
                              type: string
                              description: The device ID.
                              example: GHFnf5WQe-H-_r0Wwx9iQ
                            policy:
                              type: object
                              properties:
                                call_control:
                                  type: object
                                  properties:
                                    status:
                                      type: string
                                      description: "This field allows the call control feature to the current device. Configure the desk phone devices to enable call control, which allows users to perform desk phone's call control actions from the Zoom desktop client, including making and accepting calls. \nOptions include: \n* `unsupported` \n* `on` \n* `off`"
                                      example: 'off'
                                      enum:
                                      - unsupported
                                      - 'on'
                                      - 'off'
                                hot_desking:
                                  type: object
                                  properties:
                                    status:
                                      type: string
                                      description: "This field allows the hot desking feature to the current device. It lets the guest user sign in to the desk phone. You can't use the desk phone until the guest user signs out. \nOptions include:\n* `unsupported` \n* `on` \n* `off`"
                                      example: 'off'
                                      enum:
                                      - unsupported
                                      - 'on'
                                      - 'off'
                              description: The device policy.
                            status:
                              type: string
                              description: 'The status of the device: `online` or `offline`.'
                              example: online
                              enum:
                              - online
                              - offline
                            mac_address:
                              type: string
                              description: The MAC address or serial number of the device.
                              example: 203a07240534
                            private_ip:
                              type: string
                              description: The private IP of the registered device.
                              example: 192.168.10.13
                            public_ip:
                              type: string
                              description: The public IP of the registered device.
                              example: 220.148.231.126
                      keys_positions:
                        type: object
                        properties:
                          primary_number:
                            type: string
                            description: The primary number of the user.
                            example: '+123456789'
                      phone_screen_lock:
                        type: boolean
                        description: After enabling this option, you can lock your desk phone screen. A PIN code is required to unlock your phone. This feature is not supported on some devices. See [Supported Device Types](https://support.zoom.us/hc/en-us/articles/360029698771) for more information.
                        example: true
                      pin_code:
                        type: string
                        description: The PIN code to be used to access voicemail, hot desking, and unlocking desk phones.
                        example: 0995
                    description: This field contains information on phones or devices provisioned for the user.
                  extension_number:
                    type: integer
                    description: The owner's extension number.
                    format: int64
                    example: 1000001036
                  music_on_hold_id:
                    type: string
                    description: "The music on hold ID. \n\nOptions: empty char - default and `0` - disable"
                    example: NOZ98sQvTimYi0XxL_x-iQ
                  outbound_caller:
                    type: object
                    properties:
                      number:
                        type: string
                        description: The outbound calling number.
                        example: '+123456789'
                    description: The information about the outbound caller.
                  outbound_caller_ids:
                    maxItems: 1000
                    type: array
                    items:
                      type: object
                      properties:
                        is_default:
                          type: boolean
                          description: Whether the outbound caller ID is the default or not. If `true`, the outbound caller ID is the default caller ID.
                          example: true
                        name:
                          type: string
                          description: The outbound caller's name.
                          example: Outbound caller name.
                        number:
                          type: string
                          description: The outbound caller's number.
                          example: '+2097392651'
                  status:
                    type: string
                    description: The status of the user.
                    example: Active
                    enum:
                    - Active
                    - Inactive
                    x-enum-descriptions:
                    - Active status
                    - Inactive status
                  voice_mail:
                    maxItems: 50
                    type: array
                    description: The shared voicemail access member list. &lt;b&gt;Deprecated&lt;/b&gt;, we will completely deprecate this property in a future release. Instead use policy.voicemail_access_members property from 'Get a user's profile' API.
                    items:
                      type: object
                      properties:
                        access_user_id:
                          type: string
                          description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or unique identifier of the common area depending on the access user type.
                          example: w0RChiauQeqRlv5fgxYULQ
                        access_user_type:
                          type: string
                          description: 'The extension type of the member to be added in the shared voicemail access member list. Allowed: user | commonArea.'
                          example: commonArea
                          enum:
                          - commonArea
                          - user
                        delete:
                          type: boolean
                          description: Whether the user has delete permissions. The default is **false**.
                          example: true
                        download:
                          type: boolean
                          description: Whether the user has download permissions. The default is **false**.
                          example: true
                        shared_id:
                          type: string
                          description: The unique identifier of the shared voicemail that the user can access.
                          example: --e8ugg0SeS-9clgrDkn2w
                  intercom:
                    type: object
                    properties:
                      audio_intercoms:
                        maxItems: 300
                        type: array
                        description: The extensions invited into the intercom relationship.
                        items:
                          type: object
                          properties:
                            extension_id:
                              type: string
                              description: The extension's ID.
                              example: 52OdSKGSSS-EOyJwQncFvA
                            extension_number:
                              type: string
                              description: The extension's number.
                              example: '1000001004'
                            extension_type:
                              type: string
                              description: 'The extension''s type: `user` or `commonArea`.'
                              example: user
                            display_name:
                              type: string
                              description: The display's name.
                              example: test name
                            status:
                              type: string
                              description: 'The status of the extension: `active` or `pending`.'
                              example: pending
                              enum:
                              - active
                              - pending
                            device_id:
                              type: string
                              description: The device ID. Applicable when the extension level is `commonArea`.
                              example: GHFnf5WQe-H-_r0Wwx9iQ
                            device_status:
                              type: string
                              description: The status of the device. Applicable when the extension level is `commonArea`.
                              example: offline
                              enum:
                              - online
                              - offline
                              - no device
                      device:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The device's ID.
                            example: JHwOJZ_PRICfVhQlL0x_ww
                          name:
                            type: string
                            description: The device's name.
                            example: Sita's Phone
                        description: The selected default device to which all your intercom calls will be routed.
                  auto_call_recording_access_members:
                    maxItems: 50
                    uniqueItems: true
                    type: array
                    description: The shared automatic call recording access member list. &lt;b&gt;Deprecated&lt;/b&gt;, we will completely deprecate this property in a future release. Instead use policy.auto_call_recording_access_members property from 'Get a user's profile' API.
                    items:
                      allOf:
                      - type: object
                        properties:
                          access_user_id:
                            type: string
                            description: The Zoom user ID to share the access permissions with.
                            example: w0RChiauQeqRlv5fgxYULQ
                          allow_delete:
                            type: boolean
                            description: This field specifies whether the user has delete permissions. The default is **false**.
                            example: false
                          allow_download:
                            type: boolean
                            description: This field specifies whether the user has download permissions. The default is **false**.
                            example: false
                      - type: object
                        properties:
                          shared_id:
                            type: string
                            description: The unique identifier of the shared sub-setting that the user can access.
                            example: --e8ugg0SeS-9clgrDkn2w
                  ad_hoc_call_recording_access_members:
                    maxItems: 50
                    uniqueItems: true
                    type: array
                    description: The shared ad hoc call recording access member list. &lt;b&gt;Deprecated&lt;/b&gt;, we will completely deprecate this property in a future release. Instead use policy.ad_hoc_call_recording_access_members property from 'Get a user's profile' API.
                    items:
                      allOf:
                      - type: object
                        properties:
                          access_user_id:
                            type: string
                            description: The Zoom user ID to share the access permissions with.
                            example: w0RChiauQeqRlv5fgxYULQ
                          allow_delete:
                            type: boolean
                            description: This field specifies whether the user has delete permissions. The default is **false**.
                            example: false
                          allow_download:
                            type: boolean
                            description: This field specifies whether the user has download permissions. The default is **false**.
                            example: false
                      - type: object
                        properties:
                          shared_id:
                            type: string
                            description: The unique identifier of the shared sub-setting that the user can access.
                            example: --e8ugg0SeS-9clgrDkn2w
                  shared_lines_call_setting:
                    type: object
                    properties:
                      shared_line_appearances:
                        type: object
                        properties:
                          executives:
                            type: array
                            description: The incoming call handling options for individual executives.
                            items:
                              type: object
                              properties:
                                user_id:
                                  type: string
                                  description: The user ID of current executive.
                                  example: DJPrG46sQPmaMnzFrKecOw
                                display_name:
                                  type: string
                                  description: The user display name of current executive.
                                  example: John Doe
                                receive_calls:
                                  type: boolean
                                  description: Whether receiving incoming calls for this executive. Default is **true**.
                                  example: true
                                allow_opt_out:
                                  type: boolean
                                  description: Whether the current user is allowed to opt in or out from receiving incoming calls for this executive. If false, the `receive_calls` field cannot be modified.
                                  example: true
                        description: The shared line appearances incoming call handling options.
                      shared_line_groups:
                        type: object
                        properties:
                          receive_calls:
                            type: boolean
                            description: Whether receiving incoming calls for all of the shared line groups. Default is **true**.
                            example: true
                          shared_line_group:
                            type: array
                            description: The incoming call handling options for individual shared line group.
                            items:
                              type: object
                              properties:
                                slg_id:
                                  type: string
                                  description: The unique identifier of the Shared Line Group.
                                  example: RQinnFtmTJ25mx89tW5Cmw
                                display_name:
                                  type: string
                                  description: The display name of current shared line group..
                                  example: jamieSLGTest0
                                receive_calls:
                                  type: boolean
                                  description: Whether receiving incoming calls for this shared line group. Default is **true**.
                                  example: true
                        description: The shared line groups incoming call handling options.
                    description: The shared lines incoming call handling options.
                  holiday_hours:
                    type: array
                    description: The holiday hours settings.
                    items:
                      type: object
                      properties:
                        holiday_id:
                          type: string
                          description: The holiday ID.
                          example: ULfeE4mgSImyelNmTekUfg
                        name:
                          type: string
                          description: The name of the holiday.
                          example: test
                        from:
                          type: string
                          description: The holiday's start date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                          format: date-time
                          example: '2022-03-05T00:00:00Z'
                        to:
                          type: string
                          description: The holiday's end date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                          format: date-time
                          example: '2022-03-06T00:00:00Z'
                  break_hours:
                    type: array
                    description: The break hours list.
                    items:
                      type: object
                      properties:
                        break_hour_id:
                          type: string
                          description: The unique identifier of the break hour.
                          example: R4GeDFaLTpeQb1jPDCuPhA
                        break_hour_name:
                          maxLength: 255
                          minLength: 1
                          type: string
                          description: The name of the break hour.
                          example: Lunch Break
                        break_hour_type:
                          type: string
                          description: "The type of break hour schedule: \n\n* `every_business_day` &mdash; The break applies at the same time on every business day. \n\n* `custom_hours` &mdash; The break applies on specific days of the week with individually configured times."
                          example: every_business_day
                          enum:
                          - every_business_day
                          - custom_hours
                        break_hour_setting:
                          description: The break hour time configuration. The structure depends on the `break_hour_type` field.
                          oneOf:
                          - title: Every Business Day
                            required:
                            - from
                            - to
                            type: object
                            properties:
                              from:
                                type: string
                                description: The start time of the break in `HH:mm` format (24-hour clock). For example, `12:00`.
                                example: '12:00'
                              to:
                                type: string
                                description: The end time of the break in `HH:mm` format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                example: '13:00'
                            description: Only returned when `break_hour_type` is `every_business_day`. Defines a single time range that applies to all business days.
                          - title: Custom Hours
                            required:
                            - days
                            type: object
                            properties:
                              days:
                                maxItems: 7
                                type: array
                                description: The list of days with configured break times. Only includes days that have break hours enabled.
                                items:
                                  required:
                                  - from
                                  - to
                                  - weekday
                                  type: object
                                  properties:
                                    weekday:
                                      type: integer
                                      description: "The day of the week: \n* `1` &mdash; Sunday. \n* `2` &mdash; Monday. \n* `3` &mdash; Tuesday. \n* `4` &mdash; Wednesday. \n* `5` &mdash; Thursday. \n* `6` &mdash; Friday. \n* `7` &mdash; Saturday."
                                      example: 7
                                      enum:
                                      - 1
                                      - 2
                                      - 3
                                      - 4
                                      - 5
                                      - 6
                                      - 7
                                    enable:
                                      type: boolean
                                      description: Whether the break hour is enabled on this day.
                                      example: true
                                    from:
                                      type: string
                                      description: The start time of the break on this day in `HH:mm` format (24-hour clock). For example, `12:00`.
                                      example: '12:00'
                                    to:
                                      type: string
                                      description: The end time of the break on this day in `HH:mm` format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                      example: '13:00'
                            description: Only returned when `break_hour_type` is `custom_hours`. Lists the specific days of the week on which the break is active, along with their individual time ranges.
                  business_hours_settings:
                    type: object
                    properties:
                      business_hours:
                        maxItems: 7
                        type: array
                        description: The business hours settings.
                        items:
                          type: object
                          properties:
                            from:
                              type: string
                              description: The business hours start time in `HH:mm` format.
                              example: 09:00
                            to:
                              type: string
                              description: The business hours end time in `HH:mm` format.
                              example: '18:00'
                            type:
                              type: integer
                              description: "The type of business hours: \n* `0` &mdash; Disabled. \n* `1` &mdash; 24 hours. \n* `2` &mdash; Customized hours."
                              example: 1
                              enum:
                              - 0
                              - 1
                              - 2
                            weekday:
                              type: integer
                              description: "The day of the week: \n* `1` &mdash; Sunday. \n* `2` &mdash; Monday. \n* `3` &mdash; Tuesday. \n* `4` &mdash; Wednesday. \n* `5` &mdash; Thursday. \n* `6` &mdash; Friday. \n* `7` &mdash; Saturday."
                              example: 7
                              enum:
                              - 1
                              - 2
                              - 3
                              - 4
                              - 5
                              - 6
                              - 7
                      business_hour_type:
                        type: integer
                        description: "The type of business hours: \n* `1` &mdash; 24 hours, 7 days a week. \n* `2` &mdash; Customized hours."
                        example: 2
                        enum:
                        - 1
                        - 2
                    description: The business hours settings.
                description: The phone user setting.
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Invalid user id. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User does not exist: {userId}. <br>\n**Error Code:** `2001` <br>\n Account does not exist. <br>\n"
        '429':
