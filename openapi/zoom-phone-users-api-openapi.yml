                      - 15
                      - 20
                      - 25
                      - 30
                      - 35
                      - 40
                      - 45
                      - 50
                      - 55
                      - 60
                  description: The call distribution settings that control how incoming calls are routed to the user's devices.
                call_handling_setting:
                  type: object
                  properties:
                    busy_on_another_call_action:
                      type: string
                      description: 'The action to take when the user is busy on another call.

                        * `call_waiting` — Enable call waiting.

                        * `forward_to_voicemail` — Forward to voicemail or videomail.

                        * `play_message_then_disconnect` — Play a message and then disconnect.

                        * `play_busy_signal` — Play a busy signal.

                        * `forward_to_extension` — Forward to another extension.

                        * `forward_to_external_contact` — Forward to an external contact.

                        * `forward_to_external_number` — Forward to an external phone number.'
                      example: call_waiting
                      enum:
                      - call_waiting
                      - forward_to_voicemail
                      - play_message_then_disconnect
                      - play_busy_signal
                      - forward_to_extension
                      - forward_to_external_contact
                      - forward_to_external_number
                    busy_on_another_call_action_setting:
                      description: The settings based on the `busy_on_another_call_action` value. Only present when `busy_on_another_call_action` is `forward_to_voicemail`, `play_message_then_disconnect`, `forward_to_extension`, `forward_to_external_contact`, or `forward_to_external_number`. When `busy_on_another_call_action` and `call_not_answer_action` are both `forward_to_voicemail`, the voicemail sub-settings (greeting, instructions, operator, etc.) are shared between the two behaviors — updating this object also takes effect on `call_not_answer_action_setting`.
                      oneOf:
                      - title: Forward to Voicemail or Videomail
                        type: object
                        properties:
                          allow_callers_check_voicemail:
                            type: boolean
                            description: Whether to allow callers to check voicemail.
                            example: false
                          connect_to_operator:
                            type: boolean
                            description: Whether to allow callers to reach an operator.
                            example: false
                          operator_extension:
                            type: object
                            properties:
                              extension_id:
                                type: string
                                description: The operator's extension ID.
                                example: jN9mb38lQTaMgxUq3Nd6ow
                            description: The operator's extension information. Only required when `connect_to_operator` is `true`.
                          voicemail_greeting:
                            type: object
                            properties:
                              audio_id:
                                type: string
                                description: The audio prompt file ID.
                                example: yCT14TwySDGVUypVlKNEyA
                            description: The voicemail or videomail greeting prompt.
                          leave_voicemail_instruction:
                            type: object
                            properties:
                              audio_id:
                                type: string
                                description: The audio prompt file ID.
                                example: yCT14TwySDGVUypVlKNEyA
                            description: The leave voicemail instruction prompt. Only takes effect when `connect_to_operator` or `allow_callers_check_voicemail` is `true`.
                          play_callee_voicemail_greeting:
                            type: boolean
                            description: Whether to play the callee's voicemail greeting when the caller reaches the end of the forwarding sequence. Only takes effect when `connect_to_operator` is `true`.
                            example: false
                        description: Only used when `busy_on_another_call_action` is `forward_to_voicemail`.
                      - title: Forward to Extension
                        type: object
                        properties:
                          forward_to_extension:
                            required:
                            - extension_id
                            type: object
                            properties:
                              extension_id:
                                type: string
                                description: The extension ID.
                                example: jN9mb38lQTaMgxUq3Nd6ow
                            description: The extension to forward calls to.
                          play_callee_voicemail_greeting:
                            type: boolean
                            description: Whether to play the callee's voicemail greeting when the caller reaches the end of the forwarding sequence.
                            example: false
                        description: Only used when `busy_on_another_call_action` is `forward_to_extension`.
                      - title: Forward to External Number
                        required:
                        - forward_phone_number
                        type: object
                        properties:
                          forward_phone_number:
                            type: string
                            description: The external phone number to forward calls to.
                            example: '+12058945656'
                          forward_phone_number_description:
                            type: string
                            description: A description of the external phone number.
                            example: Office landline
                          require_press_1_before_connecting:
                            type: boolean
                            description: Whether to require the callee to press 1 before connecting the call.
                            example: false
                        description: Only used when `busy_on_another_call_action` is `forward_to_external_number`.
                      - title: Forward to External Contact
                        type: object
                        properties:
                          forward_to_external_contact:
                            required:
                            - external_contact_id
                            type: object
                            properties:
                              external_contact_id:
                                type: string
                                description: The external contact's ID.
                                example: OJGi5xOFQPmrJbKg68-iWg
                            description: The external contact to forward calls to.
                          require_press_1_before_connecting:
                            type: boolean
                            description: Whether to require the callee to press 1 before connecting the call.
                            example: false
                        description: Only used when `busy_on_another_call_action` is `forward_to_external_contact`.
                      - title: Play a Message then Disconnect
                        type: object
                        properties:
                          message_greeting:
                            type: object
                            properties:
                              audio_id:
                                type: string
                                description: The audio prompt file ID.
                                example: yCT14TwySDGVUypVlKNEyA
                            description: The message audio prompt played before disconnecting.
                        description: Only used when `busy_on_another_call_action` is `play_message_then_disconnect`.
                    call_not_answer_action:
                      type: string
                      description: 'The action to take when a call is not answered.

                        * `forward_to_voicemail` — Forward to voicemail.

                        * `forward_to_extension` — Forward to an extension.

                        * `forward_to_external_contact` — Forward to an external contact.

                        * `forward_to_external_number` — Forward to an external phone number.

                        * `play_message_then_disconnect` — Play a message and then disconnect.

                        * `disconnect` — Disconnect.'
                      example: forward_to_voicemail
                      enum:
                      - forward_to_voicemail
                      - forward_to_extension
                      - forward_to_external_contact
                      - forward_to_external_number
                      - play_message_then_disconnect
                      - disconnect
                    call_not_answer_action_setting:
                      description: The settings based on the `call_not_answer_action` value. Only present when `call_not_answer_action` is not `disconnect`. When `busy_on_another_call_action` and `call_not_answer_action` are both `forward_to_voicemail`, the voicemail sub-settings (greeting, instructions, operator, etc.) are shared between the two behaviors — updating this object also takes effect on `busy_on_another_call_action_setting`.
                      oneOf:
                      - title: Forward to Voicemail
                        type: object
                        properties:
