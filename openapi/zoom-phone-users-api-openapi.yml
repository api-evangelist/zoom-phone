                  example: NOZ98sQvTimYi0XxL_x-iQ
                outbound_caller_id:
                  type: string
                  description: The user's outbound caller ID phone number, in E164 format. If you hide the caller ID, set the value to an `empty string`
                  example: '+123123123'
                shared_lines_call_setting:
                  type: object
                  properties:
                    shared_line_appearances:
                      type: object
                      properties:
                        executives:
                          maxItems: 15
                          type: array
                          description: The incoming call handling options for individual executives.
                          items:
                            type: object
                            properties:
                              user_id:
                                type: string
                                description: The user ID of current executive.
                                example: DJPrG46sQPmaMnzFrKecOw
                              receive_calls:
                                type: boolean
                                description: Whether receiving incoming calls for this executive, modifying this setting requires opt in/out delegation privileges.
                                example: true
                      description: The shared line appearances incoming call handling options.
                    shared_line_groups:
                      type: object
                      properties:
                        receive_calls:
                          type: boolean
                          description: Whether receiving incoming calls for all of the shared line groups.
                          example: true
                        shared_line_group:
                          maxItems: 10
                          type: array
                          description: The incoming call handling options for individual shared line group.
                          items:
                            type: object
                            properties:
                              slg_id:
                                type: string
                                description: The unique identifier of the Shared Line Group.
                                example: RQinnFtmTJ25mx89tW5Cmw
                              receive_calls:
                                type: boolean
                                description: Whether receiving incoming calls for this shared line group.
                                example: true
                      description: The shared line groups incoming call handling options.
                  description: Whether handling incoming calls for this executive or modifying call settings, delegation privileges to opt in or out are required.
                break_hours:
                  type: object
                  properties:
                    break_hour_settings:
                      maxItems: 5
                      type: array
                      description: The list of break hour settings.
                      items:
                        type: object
                        properties:
                          break_hour_id:
                            type: string
                            description: The unique identifier of the break hour.
                            example: R4GeDFaLTpeQb1jPDCuPhA
                          break_hour_name:
                            maxLength: 255
                            minLength: 1
                            type: string
                            description: The name of the break hour.
                            example: Lunch Break
                          break_hour_type:
                            type: string
                            description: "The type of break hour schedule: \n\n* `every_business_day` &mdash; The break applies at the same time on every business day. \n\n* `custom_hours` &mdash; The break applies on specific days of the week with individually configured times."
                            example: every_business_day
                            enum:
                            - every_business_day
                            - custom_hours
                          break_hour_setting:
                            description: The break hour time configuration. The structure depends on the `break_hour_type` field.
                            oneOf:
                            - title: Every Business Day
                              required:
                              - from
                              - to
                              type: object
                              properties:
                                from:
                                  type: string
                                  description: The start time of the break in `HH:mm` format (24-hour clock). For example, `12:00`.
                                  example: '12:00'
                                to:
                                  type: string
                                  description: The end time of the break in `HH:mm` format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                  example: '13:00'
                              description: Only returned when `break_hour_type` is `every_business_day`. Defines a single time range that applies to all business days.
                            - title: Custom Hours
                              required:
                              - days
                              type: object
                              properties:
                                days:
                                  maxItems: 7
                                  type: array
                                  description: The list of days with configured break times. Only includes days that have break hours enabled.
                                  items:
                                    required:
                                    - from
                                    - to
                                    - weekday
                                    type: object
                                    properties:
                                      weekday:
                                        type: integer
                                        description: "The day of the week: \n* `1` &mdash; Sunday. \n* `2` &mdash; Monday. \n* `3` &mdash; Tuesday. \n* `4` &mdash; Wednesday. \n* `5` &mdash; Thursday. \n* `6` &mdash; Friday. \n* `7` &mdash; Saturday."
                                        example: 7
                                        enum:
                                        - 1
                                        - 2
                                        - 3
                                        - 4
                                        - 5
                                        - 6
                                        - 7
                                      enable:
                                        type: boolean
                                        description: Whether the break hour is enabled on this day.
                                        example: true
                                      from:
                                        type: string
                                        description: The start time of the break on this day in `HH:mm` format (24-hour clock). For example, `12:00`.
                                        example: '12:00'
                                      to:
                                        type: string
                                        description: The end time of the break on this day in `HH:mm` format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                        example: '13:00'
                              description: Only returned when `break_hour_type` is `custom_hours`. Lists the specific days of the week on which the break is active, along with their individual time ranges.
                  description: The list of break hours. `break_hours` cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`.
                business_hours_settings:
                  type: object
                  properties:
                    business_hours:
                      maxItems: 7
                      type: array
                      description: The business hours settings.
                      items:
                        type: object
                        properties:
                          from:
                            type: string
                            description: The business hours start time in `HH:mm` format.
                            example: 09:00
                          to:
                            type: string
                            description: The business hours end time in `HH:mm` format.
                            example: '18:00'
                          type:
                            type: integer
                            description: "The type of business hours: \n* `0` &mdash; Disabled. \n* `1` &mdash; 24 hours. \n* `2` &mdash; Customized hours."
                            example: 1
                            enum:
                            - 0
                            - 1
                            - 2
                          weekday:
                            type: integer
                            description: "The day of the week: \n* `1` &mdash; Sunday. \n* `2` &mdash; Monday. \n* `3` &mdash; Tuesday. \n* `4` &mdash; Wednesday. \n* `5` &mdash; Thursday. \n* `6` &mdash; Friday. \n* `7` &mdash; Saturday."
                            example: 7
                            enum:
                            - 1
                            - 2
                            - 3
                            - 4
                            - 5
                            - 6
                            - 7
                    business_hour_type:
                      type: integer
                      description: "The type of business hours: \n* `1` &mdash; 24 hours, 7 days a week. \n* `2` &mdash; Customized hours."
                      example: 2
                      enum:
                      - 1
                      - 2
                  description: The business hours settings.
                holiday_hours:
                  type: object
                  properties:
                    holidays:
                      maxItems: 10
                      minItems: 1
                      type: array
                      description: The holiday list. The minimum is one item and the maximum is 10 items.
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                            description: The name of the holiday.
                            example: holiday name
                          from:
                            type: string
                            description: The holiday's start date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                            example: '2022-03-05T00:00:00Z'
                          to:
                            type: string
                            description: The holiday's end date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                            example: '2022-03-06T00:00:00Z'
                        description: The holiday information.
                  description: The holiday hours settings.
      responses:
        '204':
          description: "**HTTP Status Code:** `204`  \n \nUser Setting updated."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Invalid user id. <br>\n**Error Code:** `400` <br>\n Outbound caller id has been locked.\nDo not allow hiding outbound caller id.\nInvalid outbound caller ID. <br>\n**Error Code:** `405` <br>\n The number of items for shared_lines_call_setting.shared_line_appearances.executives must not exceed 15. <br>\n**Error Code:** `405` <br>\n The number of items for shared_lines_call_setting.shared_line_groups.shared_line_group must not exceed 10. <br>\n**Error Code:** `1151` <br>\n User {userId} cannot disable receiving incoming calls for executive {executiveUserId}. <br>\n**Error Code:** `15101` <br>\n Break hour does not exist: {breakHourId}. <br>\n**Error Code:** `15102` <br>\n Holiday hour does not exist: {holidayHourId}. <br>\n**Error Code:** `15104` <br>\n The {hour_type} cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User does not exist: {userId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
