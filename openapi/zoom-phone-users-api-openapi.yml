                        incoming:
                          type: boolean
                          description: Whether the incoming policy is enabled for the phone number.
                          example: true
                        outgoing:
                          type: boolean
                          description: Whether the outgoing policy is enabled for the phone number.
                          example: true
                        extension_id:
                          type: string
