      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write
        - phone:delete:shared_setting
        - phone:delete:shared_setting:admin
        openapi_authorization: []
      x-extensions:
        x-macro-scopes:
        - phone:write:admin
        - phone:write
        x-granular-scopes:
        - phone:delete:shared_setting
        - phone:delete:shared_setting:admin
    patch:
      tags:
      - Users
      summary: Update a user's shared access setting
      description: "Updates the user setting according to the setting type, specifically for delegation, intercom and shared access for voicemail and call recordings. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\nTo see the shared access settings in the Zoom web portal, go to **Admin &gt; Phone System Management &gt; Users &amp; Rooms** . Choose **Users** and select **User Policy**. Go to **Voicemail, Automatic Call Recording and Ad Hoc Call Recording**.\n\n To view the delegation and intercom setting in your Zoom web portal, navigate to **Admin &gt; Phone System Management &gt; Users &amp; Rooms**. Choose the **Users** tab and select **User Settings**\n\n **Prerequisites:** \n* A Business or Enterprise account\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`,`phone:write`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:shared_setting`,`phone:update:shared_setting:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: updateUserSetting
      parameters:
      - name: settingType
        in: path
        description: 'This field corresponds to the setting item you wish to modify. Allowed values: `voice_mail`, `delegation`, `desk_phone`, `intercom`, `auto_call_recording`,`ad_hoc_call_recording`'
        required: true
        schema:
          type: string
          example: voice_mail
      - name: userId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
          example: w0RChiauQeqRlv5fgxYULQ
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delegation:
                  type: object
                  properties:
                    privacy:
                      type: boolean
                      description: Whether to allow members to prevent others from picking up a held call, and listening, whispering, barging, or taking over a call if it's configured.
                      example: true
                    privileges:
                      maxItems: 10
                      type: array
                      description: The delegation privileges. 1-Place Calls, 2-Answer Calls, 3-Pick Up Hold Calls, 4-Manage VIP Contacts, 5-Opt In/Out, 6-Join and Merge Calls, 7-Set Business Hours, 8-Reply to SMS.
                      items:
                        type: integer
                        example: 2
                      enum:
                      - 1
                      - 2
                      - 3
                      - 4
                      - 5
                      - 6
                      - 7
                      - 8
                    locked:
                      type: boolean
                      description: Whether to allow users to access to the feature of delegation.
                      example: true
                  description: The user delegation.
                desk_phone:
                  type: object
                  properties:
                    devices:
                      maxItems: 10
                      type: array
                      description: The setting for the devices.
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            description: The device ID.
                            example: -GHFnf5WQe-H-_r0Wwx9iQ
                          policy:
                            type: object
                            properties:
                              call_control:
                                type: object
                                properties:
                                  status:
                                    type: string
                                    description: "This field allows call control features to the current device: configure the desk phone devices to mirror call control actions of the Zoom desktop client, including making and accepting calls. \nOptions include: \n* `on` \n* `off`"
                                    example: 'off'
                                    enum:
                                    - 'on'
                                    - 'off'
                              hot_desking:
                                type: object
                                properties:
                                  status:
                                    type: string
                                    description: "This field allows hot desking feature to the current device: letting the guest user sign in to the desk phone. You can't use the desk phone until the guest user signs out. \nOptions include: \n* `on` \n* `off`"
                                    example: 'off'
                                    enum:
                                    - 'on'
                                    - 'off'
                            description: The device policy.
                    phone_screen_lock:
                      type: boolean
                      description: After enabling this option, you can lock your desk phone screen. PIN Code is required to unlock your phone. This feature is not supported on some devices. See [Supported Device Types](https://support.zoom.us/hc/en-us/articles/360029698771) for more information.
                      example: true
                    pin_code:
                      type: string
                      description: The PIN Code to access voicemail, hot desking, and unlocking desk phones.
                      example: 09912
                  description: This field updates desk phone information.
                voice_mail:
                  type: object
                  properties:
                    access_user_id:
                      type: string
                      description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or unique identifier of the common area depending on the access user type.
                      example: w0RChiauQeqRlv5fgxYULQ
                    access_user_type:
                      type: string
                      description: 'The extension type of the member to be added in the shared voicemail access member list. Allowed: user | commonArea.'
                      example: commonArea
                      enum:
                      - commonArea
                      - user
                    delete:
                      type: boolean
                      description: Whether the user has delete permissions. The default is **false**.
                      example: true
                    download:
                      type: boolean
                      description: Wether the user has download permissions. The default is **false**.
                      example: true
                    shared_id:
                      type: string
                      description: This field specifies the ID of the voicemail.
                      example: --e8ugg0SeS-9clgrDkn2w
                  description: This field updates the voicemail setting. &lt;b&gt;Deprecated:&lt;/b&gt; we will completely deprecate this property in a future release. Use property `voicemail_access_members` instead.
                intercom:
                  type: object
                  properties:
                    extension_id:
                      type: string
                      description: The ID of the extension that you want to invite intercom connection.
                      example: JHwOJZ_PRICfVhQlL0x_ww
                    device_id:
                      type: string
                      description: The ID of the device to which all your intercom calls will be routed.
                      example: wG2kKqxyTJOCETmOpS5Kww
                  description: This field updates the intercom setting.
                voicemail_access_members:
                  maxItems: 10
                  uniqueItems: true
                  type: array
                  description: The shared voicemail access member list.
                  items:
                    allOf:
                    - type: object
                      properties:
                        access_user_id:
                          type: string
                          description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or unique identifier of the common area depending on the access user type.
                          example: w0RChiauQeqRlv5fgxYULQ
                        access_user_type:
                          type: string
                          description: 'The extension type of the member to be added in the shared voicemail access member list. Allowed: user | commonArea.'
                          example: commonArea
                          enum:
                          - commonArea
                          - user
                        allow_delete:
                          type: boolean
                          description: Whether the user has delete permissions. The default is **false**.
                          example: false
                        allow_download:
                          type: boolean
                          description: Whether the user has download permissions. The default is **false**.
                          example: false
                        allow_sharing:
                          type: boolean
                          description: Whether the user has permission to share. The default is **false**.
                          example: false
                    - type: object
                      properties:
                        shared_id:
                          type: string
                          description: ' The unique identifier of the shared sub-setting that the user can access.'
                          example: --e8ugg0SeS-9clgrDkn2w
                auto_call_recording_access_members:
                  maxItems: 20
                  uniqueItems: true
                  type: array
                  description: The shared automatic call recording access member list.
                  items:
                    allOf:
                    - type: object
                      properties:
                        access_user_id:
                          type: string
                          description: The Zoom user ID to share the access permissions with.
                          example: w0RChiauQeqRlv5fgxYULQ
                        allow_delete:
                          type: boolean
                          description: This field specifies whether the user has delete permissions. The default is **false**.
                          example: false
                        allow_download:
                          type: boolean
                          description: This field specifies whether the user has download permissions. The default is **false**.
                          example: false
                    - type: object
                      properties:
                        shared_id:
                          type: string
                          description: The unique identifier of the shared sub-setting that the user can access.
                          example: --e8ugg0SeS-9clgrDkn2w
                ad_hoc_call_recording_access_members:
                  maxItems: 20
                  uniqueItems: true
                  type: array
                  description: The shared ad hoc call recording access member list.
                  items:
                    allOf:
                    - type: object
                      properties:
                        access_user_id:
                          type: string
                          description: The Zoom user ID to share the access permissions with.
                          example: w0RChiauQeqRlv5fgxYULQ
                        allow_delete:
                          type: boolean
                          description: This field specifies whether the user has delete permissions. The default is **false**.
                          example: false
                        allow_download:
                          type: boolean
                          description: This field specifies whether the user has download permissions. The default is **false**.
                          example: false
                    - type: object
                      properties:
                        shared_id:
                          type: string
                          description: The unique identifier of the shared sub-setting that the user can access.
                          example: --e8ugg0SeS-9clgrDkn2w
      responses:
        '204':
          description: "**HTTP Status Code:** `204`  \n \nNo Content  \n "
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Invalid user id.\nInvalid user setting Type: {settingType}.\nDelegation privileges error.\nDelegation privacy error.\nDelegation assistants do not exist. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User does not exist: {userId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write
        - phone:update:shared_setting
        - phone:update:shared_setting:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        - phone:write
        x-granular-scopes:
        - phone:update:shared_setting
        - phone:update:shared_setting:admin
