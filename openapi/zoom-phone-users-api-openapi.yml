  /phone/users/{userId}/calling_plans:
    put:
      tags:
      - Users
      summary: Update user's calling plan
      description: "Switches the [calling plans](https://marketplace.zoom.us/docs/api-reference/other-references/plans#zoom-phone-calling-plans) of a [Zoom Phone](https://support.zoom.us/hc/en-us/categories/360001370051-Zoom-Phone) user. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter. \n\n**Prerequisites** \n* A Business or Enterprise account \n* A Zoom Phone license\n\n\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`,`phone:write`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:calling_plan`,`phone:update:calling_plan:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: updateCallingPlan
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          example: fWOgOALdT1ei4vjXK-QYsA
      requestBody:
        content:
          application/json:
            schema:
              required:
              - source_type
              - target_type
              type: object
              properties:
                source_type:
                  type: integer
                  description: The [type](https://marketplace.zoom.us/docs/api-reference/other-references/plans#zoom-phone-calling-plans) of the calling plan.
                  example: 100
                target_type:
                  type: integer
                  description: ' The [type](https://marketplace.zoom.us/docs/api-reference/other-references/plans#zoom-phone-calling-plans) of the calling plan.'
                  example: 200
                source_billing_subscription_id:
                  type: string
                  description: The billing subscription ID of source type.When there is more than one plan type A in this account, it cannot be empty.
                  example: FT-SUBREF-21168178
                target_billing_subscription_id:
                  type: string
                  description: The billing subscription ID of target type.When there is more than one plan type A in this account, it cannot be empty.
                  example: FT-SUBREF-21168178
      responses:
        '204':
          description: "**HTTP Status Code:** `204`   \n \nCalling plan updated successfully."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `404` <br>\n User did not subscribe to the source plan. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User does not exist:{userId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write
        - phone:update:calling_plan
        - phone:update:calling_plan:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        - phone:write
        x-granular-scopes:
        - phone:update:calling_plan
        - phone:update:calling_plan:admin
    post:
      tags:
      - Users
      summary: Assign calling plan to a user
      description: "Assigns a [calling plan](https://marketplace.zoom.us/docs/api-reference/other-references/plans#zoom-phone-calling-plans) to a [Zoom Phone](https://support.zoom.us/hc/en-us/categories/360001370051-Zoom-Phone) user. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\n**Prerequisites** \n* A Business or Enterprise account \n* A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write`,`phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:calling_plan`,`phone:write:calling_plan:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: assignCallingPlan
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          type: string
          example: fWOgOALdT1ei4vjXK-QYsA
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                calling_plans:
                  maxItems: 150
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: integer
                        description: The [type](https://developers.zoom.us/docs/api/references/phone-calling-plans/) of calling plan.
                        example: 100
                      billing_account_id:
                        type: string
                        description: The billing account ID. If the user is located in India, this field is required.
                        example: 3WWAEiEjTj2IQuyDiKMd_A
                      billing_subscription_id:
                        type: string
                        description: The billing subscription ID. It displays when the account supports billing multiple subscriptions
                        example: FT-SUBREF-21168178
      responses:
        '200':
          description: "**HTTP Status code:** `200`  \n \nCalling plan assigned successfully."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Invalid user id.\nInvalid field. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User does not exist:{userId}. <br>\n**Error Code:** `2001` <br>\n Account does not exist. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write
        - phone:write:admin
        - phone:write:calling_plan
        - phone:write:calling_plan:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write
        - phone:write:admin
        x-granular-scopes:
        - phone:write:calling_plan
        - phone:write:calling_plan:admin
