  /phone/users/{userId}/policies/{policyType}:
    get:
      tags:
      - Users
      summary: Get user policy details
      description: 'Returns the user policy details.


        **Prerequisites**

        * Pro or higher account plan with Zoom phone license




        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:read:user_policy:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `MEDIUM`'
      operationId: GetUserPolicyDetails
      parameters:
      - name: userId
        in: path
        description: The user ID.
        required: true
        schema:
          type: string
          example: kLD4F3WBT-O9LYE31C0tRQ
      - name: policyType
        in: path
        description: 'This field specifies the type of policy to retrieve or modify. See the documentation for detailed behavior of each policy type.

          - `allow_emergency_calls`: Controls whether emergency calls are allowed.'
        required: true
        schema:
          type: string
          example: allow_emergency_calls
          enum:
          - allow_emergency_calls
      responses:
        '200':
          description: '**HTTP Status Code:** `200` **OK**


            Get user policy details successfully.'
          content:
            application/json:
              schema:
                oneOf:
                - title: Allow Emergency Calls
                  type: object
                  properties:
                    allow_emergency_calls:
                      type: object
                      properties:
                        enable:
                          type: boolean
                          description: Whether users are allowed to make emergency calls.
                          example: true
                        locked:
                          type: boolean
                          description: Whether this setting is locked by the account administrator and cannot be overridden.
                          example: true
                        locked_by:
                          type: string
                          description: This field specifies the configuration level that has enforced the lock. This indicates where the setting was originally locked and cannot be overridden.
                          example: account
                          enum:
                          - invalid
                          - account
                          - user_group
                          - site
                        modified:
                          type: boolean
                          description: Whether the current settings have been changed from the inherited defaults. If true, the settings can be reset. Applicable only when using the new policy framework.
                          example: true
                        allow_emergency_calls_from_clients:
                          type: boolean
                          description: Whether users are allowed to make emergency calls from zoom clients.
                          example: true
                        allow_emergency_calls_from_deskphones:
                          type: boolean
                          description: Whether users are allowed to make emergency calls from desk phones.
                          example: true
                      description: The user-level settings for whether emergency calls are allowed for users and from specific device types.
                  description: This field is returned only when `policyType` is `allow_emergency_calls`.
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `400` <br>\n Invalid value for parameter 'policyType'. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `2001` <br>\n Account does not exist. <br>\n**Error Code:** `1001` <br>\n User does not exist: {userId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:read:admin
        - phone:read:user_policy:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:read:admin
        x-granular-scopes:
        - phone:read:user_policy:admin
    patch:
      tags:
      - Users
      summary: Update user policy
      description: "Updates a user's [Zoom Phone](https://support.zoom.us/hc/en-us/categories/360001370051-Zoom-Phone) policy.\n\n**Prerequisites** \n* A Business or Enterprise account \n* A Zoom Phone license\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:update:user_policy:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: updateUserPolicy
      parameters:
      - name: userId
        in: path
        description: The user ID.
        required: true
        schema:
          type: string
          example: kLD4F3WBT-O9LYE31C0tRQ
      - name: policyType
        in: path
        description: 'This field specifies the type of policy to retrieve or modify. See the documentation for detailed behavior of each policy type.

          - `allow_emergency_calls`: Controls whether emergency calls are allowed.'
        required: true
        schema:
          type: string
          example: allow_emergency_calls
          enum:
          - allow_emergency_calls
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: Allow Emergency Calls
                type: object
                properties:
                  allow_emergency_calls:
                    type: object
                    properties:
                      enable:
                        type: boolean
                        description: Whether users are allowed to make emergency calls.
                        example: true
                      reset:
                        type: boolean
                        description: Whether the current settings should be reset to inherit from higher-level configurations. Only applicable when the new policy framework is in use.
                        example: true
                      allow_emergency_calls_from_clients:
                        type: boolean
                        description: Whether users are allowed to make emergency calls from Zoom clients.
                        example: true
                      allow_emergency_calls_from_deskphones:
                        type: boolean
                        description: Whether users are allowed to make emergency calls from desk phones.
                        example: true
                    description: The user-level settings for whether emergency calls are allowed for users and from specific device types.
                description: This field is supported only when policyType is set to allow_emergency_calls.
      responses:
        '204':
          description: "**HTTP Status Code:** `204`  \n \nUser policy updated."
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `400` <br>\n Invalid value for parameter 'policyType'. <br>\n**Error Code:** `400` <br>\n Reset cannot be combined with other operations. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `2001` <br>\n Account does not exist. <br>\n**Error Code:** `1001` <br>\n User does not exist: {userId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:update:user_policy:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        x-granular-scopes:
        - phone:update:user_policy:admin
  /phone/users/{userId}/profile_settings/{settingType}:
    post:
      tags:
      - Users
      summary: Add a user's profile setting
      description: 'Adds the user setting according to the setting type.


        **Prerequisites**

        * Pro or a higher account with Zoom Phone license.

        * Account owner or admin permissions.




        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write`,`phone:write:admin`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:user_setting:admin`,`phone:write:user_setting`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: addUserProfileSetting
      parameters:
      - name: userId
        in: path
        description: The user ID or extension ID.
        required: true
        schema:
          type: string
          example: 5NmyHmVoRWWk4YT5ad6oxg
      - name: settingType
        in: path
        description: 'The setting type that corresponds to the setting item you want to add. Allowed values: `holiday_hours`, `break_hours`.'
        required: true
        schema:
          type: string
          example: holiday_hours
          enum:
          - holiday_hours
          - break_hours
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - title: Holiday hour settings
                type: object
                properties:
                  holiday_hours:
                    type: object
                    properties:
                      holidays:
                        maxItems: 10
                        minItems: 1
                        type: array
                        description: The holiday list. The minimum is one item and the maximum is 10 items.
                        items:
                          required:
                          - from
                          - name
                          - to
                          type: object
                          properties:
                            name:
                              type: string
                              description: The name of the holiday.
                              example: holiday name
                            from:
                              type: string
                              description: The holiday's start date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                              format: date-time
                              example: '2022-03-05T00:00:00Z'
                            to:
                              type: string
                              description: The holiday's end date and time in `yyyy-MM-dd'T'HH:mm:ss'Z'` format.
                              format: date-time
                              example: '2022-03-06T00:00:00Z'
                          description: Each holiday.
                    description: This field is only required when the setting type is `holiday_hours`.
                description: Use this schema when the setting type is `holiday_hours`.
              - title: Break hour settings
                type: object
                properties:
                  break_hours:
                    type: object
                    properties:
                      break_hour_settings:
                        maxItems: 5
                        type: array
                        description: The list of break hour settings. This field is only required when the setting type is `break_hours`.
                        items:
                          required:
                          - break_hour_name
                          - break_hour_type
                          type: object
                          properties:
                            break_hour_name:
                              maxLength: 255
                              minLength: 1
                              type: string
                              description: The name of the break hour.
                              example: Lunch Break
                            break_hour_type:
                              type: string
                              description: "The type of break hour schedule. \n* `every_business_day` — The break applies at the same time on every business day. \n* `custom_hours` — The break applies on specific days of the week with individually configured times."
                              example: every_business_day
                              enum:
                              - every_business_day
                              - custom_hours
                            break_hour_setting:
                              description: The break hour time configuration. The structure depends on the `break_hour_type` field.
                              oneOf:
                              - title: Every Business Day
                                required:
                                - from
                                - to
                                type: object
                                properties:
                                  from:
                                    type: string
                                    description: The start time of the break in HH:mm format (24-hour clock). For example, `12:00`.
                                    example: '12:00'
                                  to:
                                    type: string
                                    description: The end time of the break in HH:mm format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                    example: '13:00'
                                description: Only required when `break_hour_type` is `every_business_day`. Defines a single time range that applies to all business days.
                              - title: Custom Hours
                                required:
                                - days
                                type: object
                                properties:
                                  days:
                                    maxItems: 7
                                    type: array
                                    description: The list of days with configured break times. Only includes days that have break hours enabled.
                                    items:
                                      required:
                                      - from
                                      - to
                                      - weekday
                                      type: object
                                      properties:
                                        weekday:
                                          type: integer
                                          description: "The day of the week: \n* `1` &mdash; Sunday \n* `2` &mdash; Monday \n* `3` &mdash; Tuesday \n* `4` &mdash; Wednesday \n* `5` &mdash; Thursday \n* `6` &mdash; Friday \n* `7` &mdash; Saturday"
                                          example: 7
                                          enum:
                                          - 1
                                          - 2
                                          - 3
                                          - 4
                                          - 5
                                          - 6
                                          - 7
                                        enable:
                                          type: boolean
                                          description: Whether the break hour is enabled on this day.
                                          example: true
                                        from:
                                          type: string
                                          description: The start time of the break on this day in HH:mm format (24-hour clock). For example, `12:00`.
                                          example: '12:00'
                                        to:
                                          type: string
                                          description: The end time of the break on this day in HH:mm format (24-hour clock). For example, `13:00`. Must be after the `from` time.
                                          example: '13:00'
                                description: Only required when `break_hour_type` is `custom_hours`. Lists the specific days of the week on which the break is active, along with their individual time ranges.
                    description: The list of break hours. This field is only required when the setting type is `break_hours`.
                description: Use this schema when the setting type is `break_hours`. `break_hours` cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`.
      responses:
        '201':
          description: "**HTTP Status Code:** `201` **Created**  \n \n\nCreated successfully."
          content:
            application/json:
              schema:
                description: The user setting created according to the setting type.
                oneOf:
                - title: Holiday hour settings
                  type: object
                  properties:
                    holiday_hours:
                      type: object
                      properties:
                        holidays:
                          type: array
                          description: The list of holidays. Returned only when the setting type is `holiday_hours`.
                          items:
                            type: object
                            properties:
                              holiday_id:
                                type: string
                                description: The holiday ID.
                                example: ULfeE4mgSImyelNmTekUfg
                              name:
                                type: string
                                description: The name of the holiday.
                                example: test
                      description: The holiday hours. Returned only when the setting type is `holiday_hours`.
                  description: Returned only when the setting type is `holiday_hours`.
                - title: Break hour settings
                  type: object
                  properties:
                    break_hours:
                      type: object
                      properties:
                        break_hour_settings:
                          maxItems: 5
                          type: array
                          description: The list of break hour settings. Returned only when the setting type is `break_hours`.
                          items:
                            required:
                            - break_hour_id
                            - break_hour_name
                            type: object
                            properties:
                              break_hour_id:
                                type: string
                                description: The unique identifier of the break hour.
                                example: R4GeDFaLTpeQb1jPDCuPhA
                              break_hour_name:
                                maxLength: 255
                                minLength: 1
                                type: string
                                description: The name of the break hour.
                                example: Lunch Break
                      description: The list of break hours. Returned only when the setting type is `break_hours`.
                  description: Returned only when the setting type is `break_hours`.
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `15104` <br>\n The {hour_type} cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n User does not exist: {userId}. <br>\n"
      security:
