  /phone/users/{userId}/call_forward_settings/{hourType}:
    post:
      tags:
      - Users
      summary: Add user call forward setting
      description: 'Adds Zoom Phone call forwarding numbers for a user under a specific hour type. Call forwarding settings let users route their inbound calls to one or more external phone numbers or external contacts during business, closed, holiday, or break hours.


        **Prerequisites:**

        * A Business or Enterprise account

        * A Zoom Phone license


        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`,`phone:write`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:user_call_handling_setting`,`phone:write:user_call_handling_setting:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: addUserCallForwardSetting
      parameters:
      - name: userId
        in: path
        description: The user ID or email address of the user. For user-level apps, pass `me` as the value for userId.
        required: true
        schema:
          type: string
          example: DYHrdpjrS3uaOf7dPkkg8w
      - name: hourType
        in: path
        description: The hour type of the call handling setting. `closed_hours` and `break_hours` cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`.
        required: true
        schema:
          type: string
          example: business_hours
          enum:
          - business_hours
          - closed_hours
          - holiday_hours
          - break_hours
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                holiday_hour_id:
                  type: string
                  description: The holiday hour ID. Required when `hourType` is `holiday_hours`.
                  example: TNxfEp2WT9emyCsAQt4qnA
                break_hour_id:
                  type: string
                  description: The break hour ID. Required when `hourType` is `break_hours`.
                  example: TNxfEp2WT9emyCsAQt4qnA
                call_forward_settings:
                  maxItems: 10
                  type: array
                  description: The call forwarding settings.
                  items:
                    type: object
                    properties:
                      enable:
                        type: boolean
                        description: Whether to receive a call.
                        example: false
                      phone_number:
                        type: string
                        description: The external phone number in [E.164](https://en.wikipedia.org/wiki/E.164) format.
                        example: '+12058945583'
                      phone_number_description:
                        type: string
                        description: The external phone number's description.
                        example: testDescription
                      external_contact:
                        type: object
                        properties:
                          external_contact_id:
                            type: string
                            description: The external contact's ID.
                            example: OJGi5xOFQPmrJbKg68-iWg
                        description: The external contact.
      responses:
        '201':
          description: "**HTTP Status Codes** `201`  \n Created."
          content:
            application/json:
              schema:
                type: object
                properties:
                  call_forward_settings:
                    maxItems: 10
                    type: array
                    description: The call forwarding settings.
                    items:
                      type: object
                      properties:
                        call_forward_id:
                          type: string
                          description: The call forwarding ID.
                          example: sd8683_fwh39_F3hfsd
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `15101` <br>\n Break hour does not exist: {breakHourId}. <br>\n**Error Code:** `15102` <br>\n Holiday hour does not exist: {holidayHourId}. <br>\n**Error Code:** `15104` <br>\n The {hour_type} cannot be updated when business hours are set to `24 Hours a Day, 7 Days a Week`. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `404` <br>\n User does not exist: {userId}. <br>\n"
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write
        - phone:write:user_call_handling_setting
        - phone:write:user_call_handling_setting:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        - phone:write
        x-granular-scopes:
        - phone:write:user_call_handling_setting
        - phone:write:user_call_handling_setting:admin
    delete:
      tags:
      - Users
      summary: Delete user call forward setting
      description: 'Delete Zoom Phone call forwarding numbers for a user under a specific hour type. Call forwarding settings let users route their inbound calls to one or more external phone numbers or external contacts during business, closed, holiday, or break hours.


        **Prerequisites:**

        * A Business or Enterprise account

        * A Zoom Phone license



        **[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`,`phone:write`


        **[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:delete:user_call_handling_setting`,`phone:delete:user_call_handling_setting:admin`


        **[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`'
      operationId: deleteUserCallForwardSetting
      parameters:
      - name: userId
        in: path
        description: The user ID or email address of the user. For user-level apps, pass the `me` value for the `userId` parameter.
        required: true
        schema:
          type: string
          example: DYHrdpjrS3uaOf7dPkkg8w
