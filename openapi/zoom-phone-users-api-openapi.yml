        x-permissions: []
        x-macro-scopes:
        - phone:write
        - phone:write:admin
        x-granular-scopes:
        - phone:update:user_setting
        - phone:update:user_setting:admin
  /phone/users/{userId}/settings/{settingType}:
    post:
      tags:
      - Users
      summary: Add a user's shared access setting
      description: "Adds the user setting according to the setting type, specifically for delegation, intercom and shared access for voicemail, and call recordings. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\nTo see the shared access settings in the Zoom web portal, go to **Admin &gt; Phone System Management &gt; Users &amp; Rooms** . Choose **Users** and select **User Policy**. Go to **Voicemail, Automatic Call Recording and Ad Hoc Call Recording**.\n\n To view the delegation and intercom setting in your Zoom web portal, navigate to **Admin &gt; Phone System Management &gt; Users &amp; Rooms**. Choose the **Users** tab and select **User Settings**\n\n **Prerequisites:** \n* A Business or Enterprise account\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`,`phone:write`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:shared_setting`,`phone:write:shared_setting:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `LIGHT`"
      operationId: addUserSetting
      parameters:
      - name: userId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
          example: w0RChiauQeqRlv5fgxYULQ
      - name: settingType
        in: path
        description: 'This field corresponds to the setting item you wish to modify. Allowed values: `voice_mail`, `delegation`, `desk_phone`, `intercom`, `auto_call_recording`,`ad_hoc_call_recording`'
        required: true
        schema:
          type: string
          example: voice_mail
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                delegation_assistant_extension_id:
                  type: string
                  description: 'The extension ID of the delegation assistant: `user` or `common area`.'
                  example: CcrEGgmeQem1uyJsuIRKwA
                device_id:
                  type: string
                  description: The device ID.
                  example: -GHFnf5WQe-H-_r0Wwx9iQ
                voice_mail:
                  type: object
                  properties:
                    access_user_id:
                      type: string
                      description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or the unique identifier of the common area, depending on the access user type.
                      example: w0RChiauQeqRlv5fgxYULQ
                    access_user_type:
                      type: string
                      description: 'The extension type of the member to be added in the shared voicemail access member list. The default type will be user if empty. Allowed: user | commonArea.'
                      example: commonArea
                      enum:
                      - commonArea
                      - user
                    delete:
                      type: boolean
                      description: Whether the user has delete permissions. The default is **false**.
                      example: true
                    download:
                      type: boolean
                      description: Whether the user has download permissions. The default is **false**.
                      example: true
                  description: 'This field allows you to update the voicemail setting. &lt;b&gt;Deprecated:&lt;/b&gt; we will completely deprecate this property in a future release. Use property `voicemail_access_members` instead. '
                voicemail_access_members:
                  maxItems: 10
                  uniqueItems: true
                  type: array
                  description: The shared voicemail access member list.
                  items:
                    type: object
                    properties:
                      access_user_id:
                        type: string
                        description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or the unique identifier of the common area, depending on the access user type.
                        example: w0RChiauQeqRlv5fgxYULQ
                      access_user_type:
                        type: string
                        description: 'The extension type of the member to be added in the shared voicemail access member list. The default type will be user if empty. Allowed: user | commonArea.'
                        example: commonArea
                        enum:
                        - commonArea
                        - user
                      allow_delete:
                        type: boolean
                        description: Whether the user has delete permissions. The default is **false**.
                        example: false
                      allow_download:
                        type: boolean
                        description: Whether the user has download permissions. The default is **false**.
                        example: false
                      allow_sharing:
                        type: boolean
                        description: Whether the user has permission to share. The default is **false**.
                        example: false
                auto_call_recording_access_members:
                  maxItems: 20
                  uniqueItems: true
                  type: array
                  description: The shared automatic call recording access member list.
                  items:
                    type: object
                    properties:
                      access_user_id:
                        type: string
                        description: The Zoom user ID to share access permissions.
                        example: w0RChiauQeqRlv5fgxYULQ
                      allow_delete:
                        type: boolean
                        description: Whether the user has delete permissions. The default is **false**.
                        example: false
                      allow_download:
                        type: boolean
                        description: Whether the user has download permissions. The default is **false**.
                        example: false
                ad_hoc_call_recording_access_members:
                  maxItems: 20
                  uniqueItems: true
                  type: array
                  description: The shared ad hoc call recording access member list.
                  items:
                    type: object
                    properties:
                      access_user_id:
                        type: string
                        description: The Zoom user ID to share access permissions.
                        example: w0RChiauQeqRlv5fgxYULQ
                      allow_delete:
                        type: boolean
                        description: Whether the user has delete permissions. The default is **false**.
                        example: false
                      allow_download:
                        type: boolean
                        description: Whether the user has download permissions. The default is **false**.
                        example: false
      responses:
        '201':
          description: "**HTTP Status Code** `201`   \n \nCreated Successfully."
          content:
            application/json:
              schema:
                type: object
                properties:
                  delegation:
                    type: object
                    properties:
                      assistants:
                        maxItems: 15
                        type: array
                        description: The delegation assistants.
                        items:
                          type: object
                          properties:
                            display_name:
                              type: string
                              description: The display name.
                              example: test delegation assistants
                            extension_id:
                              type: string
                              description: The extension ID.
                              example: CcrEGgmeQem1uyJsuIRKwA
                            extension_number:
                              type: integer
                              description: The extension number.
                              format: int64
                              example: 1000001036
                            extension_type:
                              type: string
                              description: 'The extension type: `user` or `commonArea`.'
                              example: user
                            id:
                              type: string
                              description: The user or common area ID.
                              example: w0RChiauQeqRlv5fgxYULQ
                      privacy:
                        type: boolean
                        description: Whether to allow members to prevent others from picking up a held call, and listening, whispering, barging, or taking over a call if it's configured.
                        example: true
                      privileges:
                        maxItems: 10
                        type: array
                        description: The delegation privileges. 1-Place Calls, 2-Answer Calls, 3- Pick Up Hold Calls.
                        items:
                          type: integer
                          example: 2
                        enum:
                        - 1
                        - 2
                        - 3
                    description: The user delegation.
                  voice_mail:
                    type: object
                    properties:
                      access_user_id:
                        type: string
                        description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or unique identifier of the common area depending on the access user type.
                        example: w0RChiauQeqRlv5fgxYULQ
                      access_user_type:
                        type: string
                        description: 'The extension type of the member to be added in the shared voicemail access member list. Allowed: user | commonArea.'
                        example: commonArea
                        enum:
                        - commonArea
                        - user
                      delete:
                        type: boolean
                        description: Whether the user has delete permissions. The default is **false**.
                        example: true
                      download:
                        type: boolean
                        description: Whether the user has download permissions. The default is **false**.
                        example: true
                      shared_id:
                        type: string
                        description: The unique identifier of the voicemail that the user can access.
                        example: --e8ugg0SeS-9clgrDkn2w
                    description: This field adds a voicemail setting. &lt;b&gt;Deprecated:&lt;/b&gt; we will completely deprecate this property in a future release. Use property `voicemail_access_members` instead.
                  voicemail_access_members:
                    maxItems: 50
                    uniqueItems: true
                    type: array
                    description: The shared voicemail access member list.
                    items:
                      allOf:
                      - type: object
                        properties:
                          access_user_id:
                            type: string
                            description: The member's ID in the shared voicemail access list determines the sharing or updating of access permissions. It must be the unique identifier of the user, or unique identifier of the common area depending on the access user type.
                            example: w0RChiauQeqRlv5fgxYULQ
                          access_user_type:
                            type: string
                            description: 'The extension type of the member to be added in the shared voicemail access member list. Allowed: user | commonArea.'
                            example: commonArea
                            enum:
                            - commonArea
                            - user
                          allow_delete:
                            type: boolean
                            description: Whether the user has delete permissions. The default is **false**.
                            example: false
                          allow_download:
                            type: boolean
                            description: Whether the user has download permissions. The default is **false**.
                            example: false
                          allow_sharing:
                            type: boolean
                            description: Whether the user has permission to share. The default is **false**.
                            example: false
                      - type: object
                        properties:
                          shared_id:
                            type: string
                            description: ' The unique identifier of the shared sub-setting that the user can access.'
                            example: --e8ugg0SeS-9clgrDkn2w
                  auto_call_recording_access_members:
                    maxItems: 50
                    uniqueItems: true
                    type: array
                    description: The shared automatic call recording access member list.
                    items:
                      allOf:
                      - type: object
                        properties:
                          access_user_id:
                            type: string
                            description: The Zoom user ID to share access permissions.
                            example: w0RChiauQeqRlv5fgxYULQ
                          allow_delete:
                            type: boolean
                            description: Whether the user has delete permissions. The default is **false**.
                            example: false
                          allow_download:
                            type: boolean
                            description: Whether the user has download permissions. The default is **false**.
                            example: false
                      - type: object
                        properties:
                          shared_id:
                            type: string
                            description: The unique identifier of the shared sub-setting that the user can access.
                            example: --e8ugg0SeS-9clgrDkn2w
                  ad_hoc_call_recording_access_members:
                    maxItems: 50
                    uniqueItems: true
                    type: array
                    description: The shared ad hoc call recording access member list.
                    items:
                      allOf:
                      - type: object
                        properties:
                          access_user_id:
                            type: string
                            description: The Zoom user ID to share access permissions.
                            example: w0RChiauQeqRlv5fgxYULQ
                          allow_delete:
                            type: boolean
                            description: Whether the user has delete permissions. The default is **false**.
                            example: false
                          allow_download:
                            type: boolean
                            description: Whether the user has download permissions. The default is **false**.
                            example: false
                      - type: object
                        properties:
                          shared_id:
                            type: string
                            description: The unique identifier of the shared sub-setting that the user can access.
                            example: --e8ugg0SeS-9clgrDkn2w
        '400':
          description: "**HTTP Status Code:** `400` <br>\n Bad Request  \n\n **Error Code:** `300` <br>\n Invalid user id.\nInvalid user sub-setting type.\nVoicemail has already been shared to the user.\nDelegation assistant is required.\nDelegation assistant is not a user or a common area.\nUser delegation assistant does not exist: {delegation_assistant_extension_id}. <br>\n"
        '404':
          description: "**HTTP Status Code:** `404` <br>\n Not Found  \n\n **Error Code:** `1001` <br>\n User does not exist: {userId}. <br>\n"
        '429':
          description: "**HTTP Status Code:** `429` <br>\n Too Many Requests. For more information, see [rate limits](https://developers.zoom.us/docs/api/rest/rate-limits/). \n\n "
      security:
      - openapi_oauth:
        - phone:write:admin
        - phone:write
        - phone:write:shared_setting
        - phone:write:shared_setting:admin
        openapi_authorization: []
      x-extensions:
        x-permissions: []
        x-macro-scopes:
        - phone:write:admin
        - phone:write
        x-granular-scopes:
        - phone:write:shared_setting
        - phone:write:shared_setting:admin
    delete:
      tags:
      - Users
      summary: Delete a user's shared access setting
      description: "Removes the user setting according to the setting type, specifically for delegation, intercom and shared access for voicemail and call recordings. For user-level apps, pass [the `me` value](https://marketplace.zoom.us/docs/api-reference/using-zoom-apis#mekeyword) instead of the `userId` parameter.\n\nTo see the shared access settings in the Zoom web portal, go to **Admin &gt; Phone System Management &gt; Users &amp; Rooms** . Click **Users** and select **User Policy**. Go to **Voicemail, Automatic Call Recording and Ad Hoc Call Recording**.\n\n To view the delegation and intercom setting in your Zoom web portal, navigate to **Admin &gt; Phone System Management &gt; Users &amp; Rooms**. Click the **Users** tab and select **User Settings**\n\n **Prerequisites:** \n* A Business or Enterprise account\n\n**[Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:write:admin`,`phone:write`\n\n**[Granular Scopes](https://developers.zoom.us/docs/integrations/oauth-scopes-overview/):** `phone:delete:shared_setting`,`phone:delete:shared_setting:admin`\n\n**[Rate Limit Label](https://marketplace.zoom.us/docs/api-reference/rate-limits#rate-limits):** `Light`"
      operationId: deleteUserSetting
      parameters:
      - name: userId
        in: path
        description: The unique identifier of the user.
        required: true
        schema:
          type: string
          example: w0RChiauQeqRlv5fgxYULQ
      - name: settingType
        in: path
        description: 'Corresponds to the setting item you wish to remove. Allowed values: `voice_mail`, `delegation`, `desk_phone`, `intercom`, `auto_call_recording`,`ad_hoc_call_recording`'
