docs: https://developers.zoom.us/docs/api/rate-limits/
summary: >-
  Zoom rate limits are enforced at the ACCOUNT level (shared across every app installed on the
  account) and scale with the account plan. Every endpoint carries a Rate Limit Label — LIGHT,
  MEDIUM, HEAVY or RESOURCE-INTENSIVE — published inside its OpenAPI description, and the label
  selects which per-second/daily quota the call draws from. Zoom Phone APIs have their own,
  higher table than the general Zoom API table. Exceeding a limit returns HTTP 429.
enforcement:
  scope: account
  shared_across_apps: true
  varies_by_plan: true
  status_code: 429
  labels_published_in_spec: true
  retry_after_header: false
  rate_limit_headers: false
  note: >-
    Zoom documents no X-RateLimit-* response headers and the OpenAPI declares no Retry-After
    header; the daily-limit error message tells callers to "refer to the response header for
    details on when you can make another request".
