- target: $.paths['/phone/users'].get
  update:
    x-apievangelist-phrasing:
      intent: List users who have a Zoom Phone license
      effect: read
      questions:
      - Which people in my account have a Zoom Phone license assigned?
      - Can I filter the list of phone users by site, department or cost center?
      - Is there a way to search licensed phone users by keyword and see only active ones?
      instructions:
      - text: List every phone-licensed user in my account.
      - text: List phone users at site {site_id} in department {department}.
        slots:
          site_id: query.site_id
          department: query.department
      - text: Find licensed phone users matching {keyword}.
        slots:
          keyword: query.keyword
      method: generated
      generated: '2026-10-01'
- target: $.paths['/phone/users/batch'].put
