      intent: Move or activate several phone users at once
      effect: write
      questions:
      - Can I move up to ten phone users to a different site in one request?
      - Is there a bulk way to activate or deactivate the phone feature for a group of users?
      instructions:
      - text: Move users {user_ids} to site {site_id} in one batch.
        slots:
          user_ids: requestBody.user_ids
          site_id: requestBody.site_id
      - text: Run a {batch_type} batch update with activation status {activation_status} for users {user_ids}.
        slots:
          batch_type: requestBody.batch_type
          activation_status: requestBody.activation_status
          user_ids: requestBody.user_ids
      method: generated
      generated: '2026-10-01'
